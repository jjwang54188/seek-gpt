<style>
body { margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

.hub-focus aside { display: none !important; }

.pane { display: none !important; height: calc(100vh - 48px); overflow-y: auto; scroll-behavior: smooth; }
.pane.active { display: block !important; }
#pane-py.active { display: flex !important; }
#pane-py aside { height: 100%; }
#pane-cv.active { display: flex !important; }
#pane-np.active { display: flex !important; }

#pane-cv aside { height: 100%; }
#pane-ros.active { display: flex !important; }

</style>

{name:"RGBA / alpha 通道与转换详解", cat:"颜色空间",
  sig:"cv2.cvtColor(img, cv2.COLOR_BGR2RGBA / COLOR_BGRA2RGBA / COLOR_RGBA2BGR) -> ndarray",
  params:[
   ["COLOR_BGR2RGBA","3 → 4 通道","普通 3 通道 BGR 图加第 4 层 alpha，且全填 255（完全不透明）。原图没有透明信息，相当于顺便补一层，供需要 4 通道的程序使用"],
   ["COLOR_BGRA2RGBA","4 → 4 通道","只把 BGRA 的通道顺序调成 RGBA，alpha 原样保留。用 imread(-1) 读出的透明图要转 RGBA 必须用它，用 BGR2RGBA 会重置/丢 alpha"],

   ["COLOR_BGR2RGBA","3 → 4","新加的层全填 255"],
   ["COLOR_BGRA2RGBA","4 → 4","保留原值，仅换顺序"],
   ["COLOR_RGBA2BGR","4 → 3","直接丢弃"],
  ],
  example:"# 场景1：读透明 PNG 并保留 alpha 转 RGBA\nimg = cv2.imread(\"logo.png\", -1)              # 4 通道 BGRA\nrgba = cv2.cvtColor(img, cv2.COLOR_BGRA2RGBA)   # alpha 保留\n\n# 场景2：普通 3 通道图补一层全不透明 alpha\nrgba2 = cv2.cvtColor(img3, cv2.COLOR_BGR2RGBA)\nprint(rgba2[:, :, 3].max())   # 255 → alpha 层全部不透明",
  note:"什么时候用哪个：普通 3 通道图 → BGR2RGBA；imread(-1) 读出的透明图 → 必须 BGRA2RGBA（用错会把 alpha 重置成不透明，或颜色通道错乱）。RGBA 常见用处：① matplotlib 的 plt.imshow 正常显示带透明 PNG ② 转成 PNG 保存给网页/设计软件使用（imwrite 存 .png 才支持 alpha）③ 与 PIL（png 读取默认 RGBA）互相转换。"},

{name:"cv2.VideoCapture", cat:"视频",
 sig:"cv2.VideoCapture(index_or_path) -> VideoCapture 对象",
 params:[
  ["index_or_path","int/str","0 表示第一个摄像头；或视频文件路径"],
 ],
  example:"cap = cv2.VideoCapture(0)\nwhile True:\n    ret, frame = cap.read()\n    if not ret: break\n    cv2.imshow(\"cam\", frame)\n    if cv2.waitKey(1) & 0xFF == 27: break\ncap.release()",
  note:"read() 返回 (ret, frame)，ret=False 表示读不到帧。"},
{name:"cap 常用方法（视频采集）", cat:"视频",
 sig:"cap.read() / cap.release() / cap.isOpened()",
 params:[
  ["cap.read()","-> (ret, frame)","读取下一帧；ret=False 表示播放结束或读取失败"],
  ["cap.release()","-> None","释放摄像头/视频文件，用完必须调用，否则占资源"],
  ["cap.isOpened()","-> bool","是否成功打开；对摄像头和文件都必须先判断再读帧"],
  ["cap.get(propId)","-> float","读取属性：帧宽高、FPS、总帧数等"],
  ["cap.set(propId, value)","-> bool","设置属性：分辨率、帧率等，摄像头不一定支持"],
 ],
 example:"cap = cv2.VideoCapture(\"video.mp4\")    # 或 0 打开摄像头\nif not cap.isOpened():\n    print(\"打开失败，程序退出\")\n    exit(1)\n\nfps = cap.get(cv2.CAP_PROP_FPS)\nw = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))\nh = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))\nprint(f\"分辨率 {w}x{h}, 帧率 {fps}\")\n\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break                 # 视频放完或断流\n    cv2.imshow(\"frame\", frame)\n    if cv2.waitKey(25) & 0xFF == 27:\n        break\n\ncap.release()                  # 释放资源\ncv2.destroyAllWindows()",
 note:"isOpened() 返回 False 的常见原因：① 文件路径写错/文件不存在 ② 摄像头索引不对（换 1、2 试）③ 摄像头被其他程序占用 ④ 系统没装编解码器。处理视频固定套路：isOpened 检查 → read 循环逐帧处理 → release 释放。waitKey(25) ≈ 40fps 播放速度。"},
{name:"cv2.VideoWriter", cat:"视频",
 sig:"cv2.VideoWriter(filename, fourcc, fps, frameSize, isColor=True) -> VideoWriter 对象",
 params:[
  ["filename","str","输出文件名，如 out.mp4"],
  ["fourcc","int","编码格式，cv2.VideoWriter_fourcc('m','p','4','v')"],
  ["fps","float","帧率"],
  ["frameSize","tuple","帧尺寸 (宽,高)，必须与写入帧一致"],
  ["isColor","bool","是否彩色"],
 ],
 example:"fourcc = cv2.VideoWriter_fourcc(*'mp4v')\nout = cv2.VideoWriter(\"out.mp4\", fourcc, 30.0, (640, 480))\nout.write(frame)\nout.release()"},
{name:"out 常用方法（视频保存）", cat:"视频",
 sig:"out.write(frame) / out.release() / out.isOpened()",
 params:[
  ["out.write(frame)","-> None","写入一帧；frame 尺寸必须与创建时 frameSize 完全一致"],
  ["out.release()","-> None","关闭保存；不调用会导致视频文件损坏打不开"],
  ["out.isOpened()","-> bool","是否成功创建，可写文件前建议判断"],
  ["cv2.VideoWriter_fourcc","-> int","四字符编码：*'mp4v' 存 .mp4，*'XVID' 存 .avi，*'MJPG' 通用"],
 ],
 example:"cap = cv2.VideoCapture(0)                  # 录摄像头\nfourcc = cv2.VideoWriter_fourcc(*'mp4v')\nout = cv2.VideoWriter(\"record.mp4\", fourcc, 30.0, (640, 480))\n\nwhile True:\n    ret, frame = cap.read()\n    if not ret: break\n\n    gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)   # 逐帧处理\n    frame2 = cv2.cvtColor(gray, cv2.COLOR_GRAY2BGR)\n\n    out.write(frame2)            # 保存处理后的帧\n    cv2.imshow(\"rec\", frame2)\n    if cv2.waitKey(1) & 0xFF == 27:\n        break\n\ncap.release()\nout.release()                  # 先 cap 后 out 都释放\ncv2.destroyAllWindows()",
 note:"常见坑：frameSize 写反 (w,h) 或帧尺寸不匹配 → 文件打不开或花屏；release() 忘了调 → 文件损坏。.mp4 用 mp4v，.avi 用 XVID。"},
{name:"fourcc 编码速查", cat:"视频",
 sig:"cv2.VideoWriter_fourcc(*'mp4v') -> int",
 params:[
  ["*'mp4v'","int","MPEG-4 编码，最常用，配 .mp4 后缀"],
  ["*'avc1'","int","H.264 编码，画质好体积小，需 OpenCV 编译时带支持"],
  ["*'XVID'","int","配 .avi 后缀，兼容性好"],
  ["*'MJPG'","int","Motion JPEG，逐帧 JPEG，通用但文件大"],
  ["*'DIVX'","int","旧式 MPEG-4，配 .avi"],
  ["*'I420'","int","无压缩 YUV，文件巨大，仅调试用"],
 ],
 example:"fourcc = cv2.VideoWriter_fourcc(*'mp4v')   # 星号拆包写法\nfourcc = cv2.VideoWriter_fourcc('m', 'p', '4', 'v')   # 等价逐字符写法\n\nout = cv2.VideoWriter(\"a.mp4\", fourcc, 30, (640, 480))\nprint(out.isOpened())   # False 说明编码器不支持，换一种 fourcc",
 tbl:[
  ["文件名后缀", "fourcc", "容器/说明"],
  [".mp4", "mp4v", "MPEG-4，最常用，默认首选"],
  [".mp4", "avc1", "H.264，画质好体积小，需 OpenCV 编译支持"],
  [".avi", "XVID", "兼容性最好，Windows 稳定"],
  [".avi", "MJPG", "逐帧 JPEG，通用但文件大"],
  [".avi", "DIVX", "旧式 MPEG-4"],
  [".mkv", "avc1/X264", "需系统 ffmpeg 支持"],
  [".avi", "I420", "无压缩 YUV，仅调试用"],
 ],
 note:"文件名后缀必须与 fourcc 搭配，写反（如 .mp4 配 XVID）大概率打不开或只有声音无画面。写文件失败 90% 是 fourcc 与后缀不匹配或系统缺编码器；Linux 装 ffmpeg 或改用 MJPG。"},

{name:"cv2.setMouseCallback", cat:"交互",
 sig:"cv2.setMouseCallback(winname, on_mouse, param=None) -> None",
 params:[
  ["winname","str","窗口名，回调只对该窗口的鼠标事件生效"],
  ["on_mouse","function","鼠标回调函数，签名固定 5 个参数，见下表"],
  ["param","any","任意对象(字典/列表/字符串)，每次鼠标事件原样传给回调的第5个参数，用于给回调传上下文数据"],
 ],
 tbl:[
  ["回调参数", "类型", "含义"],
  ["event","int","事件类型：EVENT_LBUTTONDOWN 左键按下 / EVENT_LBUTTONUP 左键抬起 / EVENT_MOUSEMOVE 移动 / EVENT_RBUTTONDOWN 右键按下 / EVENT_LBUTTONDBLCLK 双击"],
  ["x, y","int","鼠标当前坐标（图像像素坐标，左上角为原点）"],
  ["flags","int","按键状态标志(可组合)：EVENT_FLAG_LBUTTON 左键按住 / EVENT_FLAG_CTRLKEY 按住Ctrl / EVENT_FLAG_SHIFTKEY 按住Shift"],
  ["param","any","setMouseCallback 第 3 个参数原样传入，不传则为 None"],
 ],
 example:"# 参数名可以随便起，但 5 个参数、顺序固定：event, x, y, flags, param\ndef mouse_callback(event, x, y, flags, user_data):\n    print(event, x, y, flags, user_data)\n    if event == cv2.EVENT_LBUTTONDOWN:\n        img = user_data[\"img\"]            # 从 user_data 取上下文\n        user_data[\"points\"].append((x, y)) # 记录坐标\n        cv2.circle(img, (x, y), 3, (0, 0, 255), -1)\n\nctx = {\"img\": img, \"points\": []}\ncv2.setMouseCallback(\"win\", mouse_callback, ctx)",
 note:"回调是 OpenCV 在鼠标事件发生时自动调用的，你只需要定义好 5 个参数并注册，不能改参数个数和顺序。不能靠返回值回传数据，要靠 param 传入可变对象（字典/列表）来共享结果。flags 常用判断按住拖动：flags & cv2.EVENT_FLAG_LBUTTON。"},
{name:"cv2.createTrackbar / getTrackbarPos", cat:"交互",
 sig:"cv2.createTrackbar(trackbarname, winname, value, count, onChange=None) -> None / cv2.getTrackbarPos(trackbarname, winname) -> int",
 params:[
  ["trackbarname","str","滑动条名；getTrackbarPos 必须用创建时的同一名字"],
  ["winname","str","所属窗口名，必须先有该窗口(imshow 或 namedWindow)"],
  ["value","int","初始值，必须 0 <= value <= count"],
  ["count","int","最大值(滑到最右的值)"],
   ["onChange","function","拖动时回调，OpenCV 自动传入一个参数：滑动条当前值 int（范围 0~count），如 def on_trackbar(val)；可为空"],
  ["getTrackbarPos(trackbarname, winname)","-> int","读取滑动条当前值，需在循环里反复读取以实时响应"],
 ],
 example:"import cv2\n\ndef nothing(x):\n    pass\n\ncv2.namedWindow(\"win\")\ncv2.createTrackbar(\"th\", \"win\", 127, 255, nothing)\ncv2.createTrackbar(\"blur\", \"win\", 1, 20, nothing)\n\nwhile True:\n    th = cv2.getTrackbarPos(\"th\", \"win\")       # 读取阈值条\n    k = cv2.getTrackbarPos(\"blur\", \"win\")      # 读取模糊条\n    k = k * 2 + 1                               # 保证高斯核为奇数\n\n    gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n    blurred = cv2.GaussianBlur(gray, (k, k), 0)\n    _, bw = cv2.threshold(blurred, th, 255, cv2.THRESH_BINARY)\n    cv2.imshow(\"win\", bw)\n    if cv2.waitKey(1) & 0xFF == 27:\n        break\ncv2.destroyAllWindows()",
 note:"调试调参神器：创建条后必须在主循环里反复 getTrackbarPos 才能实时响应。配套函数：setTrackbarPos(name, win, pos) 程序内设置条位置；getTrackbarPos 在条不存在时返回 -1。"},
{name:"cv2.VideoCapture.set / get", cat:"视频",

  note:"摄像头不一定支持所有分辨率，设置后需 get 确认。"},
{name:"numpy 是什么：图像就是 numpy 数组", cat:"numpy 配合",
  sig:"import numpy as np  # OpenCV 读入的每张图像数据就是 numpy 的 ndarray 数组",
  params:[
   ["ndarray","数组类型","numpy 的核心类型。cv2.imread 返回的就是它：type(img) → <class 'numpy.ndarray'>，所以 numpy 语法可以直接用在图像上"],
   ["shape (h, w, c)","三维数组","彩色图 = 行(高) × 列(宽) × 通道(3)，第三维是 BGR 三层叠在一起；灰度图只有 (h, w) 两维"],
   ["dtype uint8","0~255","每层每格存一个 0~255 整数（一个字节），存颜色/亮度；做浮点运算的算法会转成 float32"],
   ["import 惯例","--","社区惯例写成 import numpy as np，之后用 np.zeros / np.array 等都要带 np 前缀"],
  ],
  example:"import numpy as np\nimport cv2\n\nimg = cv2.imread(\"a.jpg\")\nprint(type(img))      # <class 'numpy.ndarray'>  图像 = numpy 数组\nprint(img.shape)      # (480, 640, 3)            高480 宽640 3通道\nprint(img.dtype)      # uint8\nprint(img[0, 0])      # [B,G,R] 左上角像素颜色",
  note:"理解这层关系后，图像操作分两类：像素级操作（索引、切片、创建画布、条件改像素、拼接）是 numpy 语法，在每张卡的 example 里可直接看到；检测、滤波、绘制等算法能力才用 cv2 的函数。本分类其余卡片都建立在此概念上。"},
{name:"np.zeros / np.ones / np.full", cat:"numpy 配合",
  sig:"np.zeros(shape, dtype=np.uint8) / np.ones(shape, dtype) / np.full(shape, fill_value, dtype) -> ndarray",
  params:[
   ["shape","tuple","图像尺寸 (高, 宽, 通道数)，如 (480, 640, 3)"],
   ["dtype","np.uint8","像素类型，创建图像必须显式指定为 uint8"],
   ["fill_value","tuple","np.full 的填充色（BGR 元组或灰度值）"],
  ],
  example:"black = np.zeros((480, 640, 3), np.uint8)             # 黑色画布\nwhite = np.ones((480, 640, 3), np.uint8) * 255      # 白色画布\ngreen = np.full((480, 640, 3), (0, 255, 0), np.uint8)  # 纯绿图",
  note:"记住图像 = 0~255 的数字表：0=纯黑、255=纯白。np.zeros 每格填 0 → 直接得到黑图；np.ones 每格填 1，而 1 离 0 太近，显示出来仍是黑色，所以当白图必须先乘 255（np.ones(...)*255）；np.full 则是想填多少填多少。若只做数学运算（如均值核 np.ones((5,5))/25）则不需要乘 255。不写 dtype 默认 float64，imshow 会全黑或报错；画布建好后直接用 cv2.line / rectangle / circle / putText 在上面画图。"},
{name:"图像属性 shape / size / dtype", cat:"numpy 配合",

  note:"shape 顺序是先高后宽 (y, x)，与函数参数 (x, y) 相反，写遍历循环时最容易搞混。"},

{name:"np.where 条件替换像素", cat:"numpy 配合",
  sig:"np.where(条件, 满足时的值, 不满足时的值) -> 新数组",

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function hl(s, q) {
  s = esc(s);
  if (!q) return s;
  return s.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => "<mark>" + m + "</mark>");
}
function cardHTML(d, q) {
  return `
    <div class="card" id="fn-${d._i}">

      ${d.example ? `<div class="example">${hl(d.example, q)}</div>` : ""}
      ${d.note ? `<div class="note">${hl(d.note, q)}</div>` : ""}
    </div>`;
}

    list.innerHTML = '<div class="empty">没有匹配的结果</div>';

  }
  const groups = {};

  `).join("");
}

});

    all.forEach(section => { const visible = !q || section.textContent.toLowerCase().includes(q); section.style.display = visible ? '' : 'none'; if (visible) count++; });
    [...toc.querySelectorAll('a')].forEach((a, i) => a.style.display = document.getElementById('yoloch-' + i)?.style.display === 'none' ? 'none' : '');
    stat.textContent = q ? '匹配 ' + count + ' / ' + all.length + ' 章' : '共 ' + all.length + ' 章';
  });
})();
</script>

])    # 从列表中随机选一个\nrandom.shuffle(my_list)     # 原地打乱列表\nrandom.uniform(1, 10)       # 随机浮点数 [1.0, 10.0]"}]}]}, {"title": "第五章：列表（list）", "secs": [{"title": "5.1 基本操作", "blocks": [{"t": "code", "c": "s = [1, \"hello\", 3.14, True]   # 创建列表\ns = []                           # 空列表\ns[0]     # 访问首个（下标从 0 开始）\ns[-1]    # 访问最后（负数倒数）\ndel s[4] # 删除第 5 个元素\nprint(s) # 输出整个列表"}]}, {"title": "5.2 列表切片", "blocks": [{"t": "code", "c": "s[start:end:step]   # 切片通用语法，返回新列表\ns[:3]      # 前 3 个\ns[2:]      # 从索引 2 到末尾\ns[::2]     # 隔一个取一个\ns[::-1]    # 反转列表\ns[-3:]     # 最后 3 个"}]}, {"title": "5.3 列表遍历", "blocks": [{"t": "subtitle", "c": "for item in s:"}, {"t": "code", "c": "print(item)\nfor i, item in enumerate(s):   # 同时获取索引和值\nprint(f\"索引 {i}: {item}\")"}]}, {"title": "5.4 常用内置函数", "blocks": [{"t": "code", "c": "sum(s)   # 求和\nlen(s)   # 元素个数\nmin(s)   # 最小值\nmax(s)   # 最大值\nsorted(s)             # 返回排序后的新列表\nsorted(s, reverse=True)  # 降序"}]}, {"title": "5.5 成员判断", "blocks": [{"t": "code", "c": "if \"hello\" in s:         # 判断元素是否存在\nprint(\"找到了\")"}, {"t": "subtitle", "c": "if \"world\" not in s:"}, {"t": "code", "c": "print(\"没找到\")"}]}, {"title": "5.6 列表常用方法", "blocks": [{"t": "table", "rows": [["方法", "说明", "示例"], ["list.append(x)", "末尾添加一个元素", "s.append(99)  # [1,2]→[1,2,99]"], ["list.insert(i, x)", "在索引 i 处插入", "s.insert(0, \"首\")"], ["list.extend(it)", "拼接另一个可迭代对象", "s.extend([4,5])  # 等价 s+=[4,5]"], ["list.remove(x)", "删除第一个匹配的 x", "s.remove('hello')"], ["list.pop(i=-1)", "删除并返回索引 i 的元素", "last = s.pop()  # 默认末尾"], ["list.clear()", "清空列表", "s.clear()"], ["list.index(x)", "返回 x 首次出现的索引", "pos = s.index(\"hello\")"], ["list.count(x)", "统计 x 出现次数", "cnt = s.count(1)"], ["list.sort()", "原地升序排序", "s.sort(reverse=True)"], ["list.reverse()", "原地反转", "s.reverse()"], ["list.copy()", "浅拷贝", "s2 = s.copy()  # 等价 s2 = s[:]"]]}]}, {"title": "5.7 列表解包与组包", "blocks": [{"t": "code", "c": "a, b, c = [1, 2, 3]               # 解包\ns = [*a, *b]                      # 组包：合并列表\ns = a + b                         # 也可用 + 拼接\n# 特殊解包：\nfirst, *middle, last = [1, 2, 3, 4, 5]\n# first=1, middle=[2,3,4], last=5"}]}, {"title": "5.8 列表推导式", "blocks": [{"t": "code", "c": "# 语法1：按规则生成\nsquares = [i**2 for i in range(1, 11)]  # [1,4,9,...,100]\n# 语法2：带过滤条件\nevens = [i for i in range(20) if i % 2 == 0]\n# 语法3：if-else 三元表达式\nlabels = [\"偶\" if i%2==0 else \"奇\" for i in range(5)]\n# 语法4：嵌套（二维矩阵）\nmatrix = [[i*j for j in range(1,4)] for i in range(1,4)]\n# [[1,2,3], [2,4,6], [3,6,9]]"}, {"t": "tip", "c": "列表推导式是 Python 特色语法，比传统 for 循环简洁，但过于复杂的逻辑建议用普通循环"}]}]}, {"title": "第六章：元组（tuple）", "secs": [{"title": "6.1 基本操作", "blocks": [{"t": "code", "c": "t1 = (5, 6, 6)               # 创建元组\nt2 = (100,)                  # 单元素元组必须加逗号！\nt3 = 4, 5, 76               # 组包：可省略括号\nt1.count(6)   # 统计出现次数\nt1.index(6)   # 查找首次出现的索引"}, {"t": "warn", "c": "️ 单元素元组必须加逗号：t=(100,)，不加逗号则 (100) 只是普通括号表达式"}]}, {"title": "6.2 解包与交换", "blocks": [{"t": "code", "c": "a, b, c, d = t1              # 普通解包\nx, *y, z = (1, 2, 3, 4, 5)\n# x=1, y=[2,3,4], z=5\na, b = b, a   # 一行实现交换（无需第三个变量）"}]}]}, {"title": "第七章：集合（set）", "secs": [{"title": "7.1 基本操作", "blocks": [{"t": "code", "c": "s1 = {\"a\", \"b\", \"c\"}          # 用大括号定义\ns2 = set()                      # 空集合（必须用 set()！）\ns3 = set([1, 2, 2, 3])        # 列表转集合，自动去重 → {1,2,3}"}]}, {"title": "7.2 集合常用方法", "blocks": [{"t": "table", "rows": [["方法", "说明"], ["set.add(x)", "添加元素（已存在则无变化）"], ["set.remove(x)", "删除元素（不存在时报 KeyError）"], ["set.discard(x)", "安全删除（不存在时不报错）"], ["set.pop()", "随机删除并返回一个元素"], ["set.clear()", "清空集合"], ["set.update(it)", "批量添加元素"]]}]}, {"title": "7.3 集合运算", "blocks": [{"t": "code", "c": "s1 & s2    # 交集：同时在两个集合中\ns1 | s2    # 并集：在任意一个集合中\ns1 - s2    # 差集：在 s1 中但不在 s2 中\ns1 ^ s2    # 对称差集：不同时在两者中\n# 等价方法：intersection() / union() / difference()"}]}]}, {"title": "第八章：字典（dict）", "secs": [{"title": "8.1 基本操作", "blocks": [{"t": "code", "c": "s1 = {\"王琳\": 670, \"韩立\": 556}     # 创建字典\ns2 = dict()                           # 空字典\ns3 = {}                               # 也可直接用 {}\nscore = s1[\"王琳\"]                    # 通过 key 获取（不存在时报错）\nscore = s1.get(\"王琳\", 0)             # 安全获取（不存在返回默认值）\ns1[\"张三\"] = 720                      # 添加新键值对\ns1[\"王琳\"] = 680                      # 修改已有 value\ndel s1[\"王琳\"]                         # 删除键值对"}]}, {"title": "8.2 字典常用方法", "blocks": [{"t": "table", "rows": [["方法", "说明", "示例"], ["dict.get(k, d)", "安全获取（不存在返回 d）", "s1.get(\"张三\", \"无\")"], ["dict.keys()", "返回所有 key 的视图", "for k in s1.keys():"], ["dict.values()", "返回所有 value 的视图", "for v in s1.values():"], ["dict.items()", "返回 (k,v) 视图", "for k,v in s1.items():"], ["dict.pop(k)", "删除并返回 k 的 value", "val = s1.pop(\"王琳\")"], ["dict.popitem()", "删除并返回最后插入的键值对", "last = s1.popitem()"], ["dict.update(d)", "合并另一个字典", "s1.update({'李四':700})"], ["dict.clear()", "清空", "s1.clear()"], ["dict.setdefault(k,v)", "若 k 不存在则设为 v", "s1.setdefault(\"a\",0)"]]}]}, {"title": "8.3 遍历", "blocks": [{"t": "code", "c": "# 方式1：遍历 key"}, {"t": "subtitle", "c": "for key in s1:"}, {"t": "code", "c": "print(key, s1[key])\n# 方式2：同时遍历 key 和 value（推荐）"}, {"t": "subtitle", "c": "for key, value in s1.items():"}, {"t": "code", "c": "print(f\"{key}: {value}\")"}]}, {"title": "8.4 字典推导式", "blocks": [{"t": "code", "c": "squares = {x: x**2 for x in range(1, 6)}\n# {1:1, 2:4, 3:9, 4:16, 5:25}\neven = {x: x**2 for x in range(10) if x % 2 == 0}"}, {"t": "tip", "c": "有学生数据列表时，可结合解包遍历："}, {"t": "code", "c": "students = [(\"张三\", \"S001\", 85, 90, 78)]"}, {"t": "subtitle", "c": "for sid, name, ch, math, eng in students:"}, {"t": "code", "c": "print(f\"{name} 语文:{ch} 数学:{math} 英语:{eng}\")"}]}]}, {"title": "第九章：字符串常用方法", "secs": [{"title": "9.1 大小写转换", "blocks": [{"t": "table", "rows": [["方法", "说明", "示例"], ["str.upper()", "全部大写", "\"hello\".upper() → \"HELLO\""], ["str.lower()", "全部小写", "\"HELLO\".lower() → \"hello\""], ["str.capitalize()", "首字母大写其余小写", "\"hELLo\".capitalize() → \"Hello\""], ["str.title()", "每个单词首字母大写", "\"hello world\".title() → \"Hello World\""], ["str.swapcase()", "大小写互换", "\"Hello\".swapcase() → \"hELLO\""]]}]}, {"title": "9.2 查找与替换", "blocks": [{"t": "table", "rows": [["方法", "说明", "示例"], ["str.find(sub)", "返回子串首次出现索引", "\"hello\".find(\"ll\") → 2"], ["str.index(sub)", "同 find，未找到抛异常", "确定存在时用 index"], ["str.count(sub)", "统计子串出现次数", "\"banana\".count(\"a\") → 3"], ["str.replace(old,new)", "替换所有匹配", "\"abab\".replace(\"a\",\"c\") → \"cbcb\""], ["str.startswith(p)", "是否以 p 开头", "\"hi.txt\".startswith(\"hi\") → True"], ["str.endswith(s)", "是否以 s 结尾", "\"hi.txt\".endswith(\".txt\") → True"], ["str.strip()", "去除头尾空白", "\"  hi  \".strip() → \"hi\""], ["str.lstrip()", "只去左边空白", ""], ["str.rstrip()", "只去右边空白", ""]]}]}, {"title": "9.3 分割与拼接", "blocks": [{"t": "table", "rows": [["方法", "说明", "示例"], ["str.split(sep)", "按分隔符分割为列表", "\"a,b,c\".split(\",\") → [\"a\",\"b\",\"c\"]"], ["str.rsplit(sep,n)", "从右分割 n 次", "\"a,b,c\".rsplit(\",\",1) → [\"a,b\",\"c\"]"], ["str.splitlines()", "按换行符分割", "\"a\\nb\".splitlines() → [\"a\",\"b\"]"], ["sep.join(iterable)", "用分隔符拼接", "\",\".join([\"a\",\"b\"]) → \"a,b\""]]}]}, {"title": "9.4 判断类型", "blocks": [{"t": "table", "rows": [["方法", "说明"], ["str.isdigit()", "是否全为数字"], ["str.isalpha()", "是否全为字母"], ["str.isalnum()", "是否全为字母或数字"], ["str.isspace()", "是否全为空白"], ["str.islower()", "是否全小写"], ["str.isupper()", "是否全大写"]]}]}, {"title": "9.5 格式化与对齐", "blocks": [{"t": "code", "c": "# f-string 格式化\nf\"{3.14159:.2f}\"      # 保留两位 → \"3.14\"\nf\"{42:05d}\"           # 补零到 5 位 → \"00042\"\nf\"{0.25:.1%}\"         # 百分比 → \"25.0%\"\nf\"{1000000:,}\"        # 千位分隔符 → \"1,000,000\"\n# 对齐填充\n\"hello\".ljust(10)     # 左对齐 \"hello     \"\n\"hello\".rjust(10)     # 右对齐 \"     hello\"\n\"hello\".center(10,\"-\") # 居中 \"--hello---\""}]}]}, {"title": "第十章：函数", "secs": [{"title": "10.1 函数定义与调用", "blocks": [{"t": "subtitle", "c": "def 函数名(参数列表):"}, {"t": "code", "c": "\"\"\""}, {"t": "text", "c": "函数的说明文档（docstring）"}, {"t": "code", "c": "\"\"\"\n# 函数体\nreturn 返回值\nresult = 函数名(实参)  # 调用函数"}]}, {"title": "10.2 函数参数详解", "blocks": [{"t": "code", "c": "# 1. 位置参数（按顺序传递）"}, {"t": "subtitle", "c": "def greet(name, age):"}, {"t": "code", "c": "print(f\"{name} 今年 {age} 岁\")\n# 2. 默认参数（调用时可省略，放在必传参数之后）"}, {"t": "subtitle", "c": "def greet(name, age=18):"}, {"t": "code", "c": "print(f\"{name} 今年 {age} 岁\")\ngreet(\"小明\")  # age 使用默认值 18\n# 3. 关键字参数（按名称传递，顺序随意）\ngreet(age=20, name=\"小红\")"}, {"t": "warn", "c": "️ 位置参数必须在关键字参数之前！greet(name=\"小红\", 20) 是语法错误！"}]}, {"title": "10.3 函数示例", "blocks": [{"t": "subtitle", "c": "def calc_total(discount, rate, price=500000):"}, {"t": "code", "c": "\"\"\"计算提车总价\"\"\"\nreturn price * discount + price * rate\ntotal = calc_total(0.9, 0.1)\nprint(f\"提车总价为: {total:.0f}\")"}]}, {"title": "10.4 round() 函数", "blocks": [{"t": "code", "c": "round(3.14159, 2)   # 四舍五入保留 2 位小数 → 3.14"}, {"t": "tip", "c": "Python 的 round() 使用银行家舍入（四舍六入五留双），精确小数建议用 decimal 模块"}]}, {"title": "10.5 global 关键字", "blocks": [{"t": "code", "c": "total = 0"}, {"t": "subtitle", "c": "def add_to_total(n):"}, {"t": "code", "c": "global total     # 声明使用全局变量\ntotal += n"}, {"t": "tip", "c": "函数内部修改全局变量必须用 global 声明，否则 Python 会视为局部变量"}]}, {"title": "10.6 不定长参数", "blocks": [{"t": "code", "c": "def calc_sum(*args):          # *args：不定长位置参数，封装为元组\nreturn sum(args)\nprint(calc_sum(1, 2, 3, 4, 5))   # 可传入任意多个参数\ndef print_info(**kwargs):    # **kwargs：关键字参数，封装为字典"}, {"t": "subtitle", "c": "for k, v in kwargs.items():"}, {"t": "code", "c": "print(f\"{k}: {v}\")\nprint_info(name=\"小明\", age=18)"}, {"t": "tip", "c": "混合使用：def func(a, b, *args, **kwargs)——顺序固定，*args 必须在 **kwargs 之前"}]}, {"title": "10.7 函数作为参数（高阶函数）", "blocks": [{"t": "code", "c": "def calc(x, y, oper):          # oper 是一个函数\nreturn oper(x, y)\ndef add(a, b): return a + b\ndef sub(a, b): return a - b\nprint(calc(3, 5, add))  # 8\nprint(calc(3, 5, sub))  # -2"}]}, {"title": "10.8 匿名函数（lambda）", "blocks": [{"t": "text", "c": "lambda 用于创建简短的匿名函数，常作为高阶函数的参数。"}, {"t": "code", "c": "lambda 参数: 返回值表达式\nadd = lambda x, y: x + y\nprint(add(3, 5))  # 8\n# 作为 sort 的 key：\nwords = [\"apple\", \"banana\", \"pear\"]\nwords.sort(key=lambda w: len(w))    # 按长度排序\n# 配合 map/filter：\nlist(map(lambda x: x*2, [1,2,3]))       # [2,4,6]\nlist(filter(lambda x: x%2==0, [1,2,3])) # [2]"}]}, {"title": "10.9 递归函数", "blocks": [{"t": "text", "c": "函数调用自身，必须有终止条件，\"先递进，再回归\"。"}, {"t": "subtitle", "c": "def factorial(n):"}, {"t": "subtitle", "c": "if n <= 1:"}, {"t": "code", "c": "return 1               # 终止条件\nreturn n * factorial(n-1)  # 递归步骤"}, {"t": "warn", "c": "️ 递归深度过大可能 RecursionError（默认 ~1000 层），大量递归考虑用迭代或 lru_cache"}]}, {"title": "10.10 类型注解（Type Hints）", "blocks": [{"t": "code", "c": "a: int = 655\nnames: list[str] = [\"张三\", \"李四\"]\nscores: dict[str, int] = {\"a\": 85}\nvalue: int | None = None           # Python 3.10+\n# 函数类型注解："}, {"t": "subtitle", "c": "def calc(scores: list[int]) -> float:"}, {"t": "code", "c": "return sum(scores) / len(scores)\ndef get_stats(data: list[int]) -> tuple[float, float]:\navg = sum(data) / len(data)\nreturn avg, sum(data)"}]}]}, {"title": "第十一章：模块与包", "secs": [{"title": "11.1 模块导入方式", "blocks": [{"t": "code", "c": "import random                      # 导入整个模块\nimport random as rd                # 别名\nfrom random import randint         # 指定功能\nfrom random import randint as ri   # 功能别名\nfrom random import *               # 全部（不推荐）"}, {"t": "subtitle", "c": "自定义模块导入："}, {"t": "code", "c": "import my_module  # 直接以 .py 文件名作为模块名"}]}, {"title": "11.2 常用内置变量", "blocks": [{"t": "code", "c": "# __name__：模块名\n#   直接运行：__name__ == \"__main__\"\n#   被导入时：__name__ == 模块名"}, {"t": "subtitle", "c": "if __name__ == \"__main__\":"}, {"t": "code", "c": "print(\"仅直接运行时执行\")\n# __all__：控制 from xxx import * 的导出范围\n__all__ = [\"func1\", \"func2\", \"PI\"]"}, {"t": "tip", "c": "__all__ 不影响 import xxx 或 from xxx import y"}]}, {"title": "11.3 常量与技巧", "blocks": [{"t": "code", "c": "PI = 3.14159          # 常量全大写（约定俗成）\nprint(\"-\" * 30)        # 输出 30 个 -"}]}, {"title": "11.4 包（Package）", "blocks": [{"t": "text", "c": "包 = 包含 __init__.py 的文件夹，用于组织模块。"}, {"t": "code", "c": "# my_package/\n#   ├── __init__.py\n#   ├── module_a.py\n#   └── module_b.py\nimport my_package.module_a              # 方式1\nfrom my_package import module_a         # 方式2\nfrom my_package.module_a import func    # 方式3\n# __init__.py 元信息：\n__version__ = \"1.0.0\"\n__author__ = \"房东卓\"\n__all__ = [\"module_a\", \"module_b\"]"}]}, {"title": "11.5 导入路径", "blocks": [{"t": "code", "c": "# 绝对路径：从项目根目录查找\nfrom chapter2.utils.log import log\n# 相对路径：从当前文件目录查找\nfrom .module_a import func      # . 当前包\nfrom ..utils import helper      # .. 父级包"}]}]}, {"title": "第十二章：面向对象编程（OOP）", "secs": [{"title": "12.1 基本概念", "blocks": [{"t": "text", "c": "对象 = 属性（特征） + 方法（功能）"}, {"t": "text", "c": "类 = 具有相同属性和方法的模板"}, {"t": "text", "c": "对象是类的实例"}, {"t": "tip", "c": "面向对象关注\"谁来帮我做\"，面向过程关注\"做事的步骤\""}]}, {"title": "12.2 类的定义与实例化", "blocks": [{"t": "code", "c": "class Car:                         # 类名 CamelCase"}, {"t": "subtitle", "c": "def __init__(self, brand, name, price):"}, {"t": "code", "c": "\"\"\"初始化方法，创建对象时自动调用\"\"\"\nself.brand = brand          # 实例属性\nself.name = name\nself.price = price"}, {"t": "subtitle", "c": "def running(self):"}, {"t": "code", "c": "\"\"\"实例方法\"\"\"\nprint(f\"{self.brand} {self.name} 正在高速行驶...\")"}, {"t": "subtitle", "c": "def total_cost(self, discount, rate):"}, {"t": "code", "c": "return self.price * discount + self.price * rate\nc1 = Car(\"BMW\", \"X5\", 500000)\nc1.running()\ntotal = c1.total_cost(0.9, 0.1)\nprint(f\"提车总价为: {total:.0f}\")"}]}, {"title": "12.3 实例属性 vs 类属性", "blocks": [{"t": "subtitle", "c": "class Student:"}, {"t": "code", "c": "school = \"北京大学\"     # 类属性：__init__ 外定义，所有实例共享"}, {"t": "subtitle", "c": "def __init__(self, name):"}, {"t": "code", "c": "self.name = name    # 实例属性：每个实例独立拥有\ns1 = Student(\"张三\")\ns2 = Student(\"李四\")\nprint(Student.school)   # \"北京大学\"\ns1.school = \"清华大学\"   # 仅 s1 创建同名实例属性！\nprint(Student.school)   # \"北京大学\"（类属性不变）\nprint(s1.school)        # \"清华大学\"（读到了实例属性）\nprint(s2.school)        # \"北京大学\"（读到类属性）"}]}, {"title": "12.4 动态属性与 __dict__", "blocks": [{"t": "code", "c": "c1.color = \"黑色\"         # 动态添加属性\nprint(c1.__dict__)         # 以字典形式查看所有实例属性\nprint(c1)                   # 直接打印显示内存地址"}]}, {"title": "12.5 魔法方法（Magic Methods）", "blocks": [{"t": "table", "rows": [["魔法方法", "触发时机", "说明"], ["__init__(self)", "创建对象时", "初始化属性"], ["__str__(self)", "print() / str()", "用户友好字符串"], ["__repr__(self)", "repr() / 交互环境", "开发者调试字符串"], ["__eq__(self, o)", "== 比较时", "自定义相等逻辑"], ["__lt__(self, o)", "< 比较 / sort()", "自定义排序规则"], ["__len__(self)", "len() 调用时", "返回对象长度"], ["__getitem__(s,i)", "obj[i] 索引", "支持下标访问"], ["__call__(self)", "obj() 当函数调用", "使对象可调用"], ["__enter__/__exit__", "with 语句", "资源自动管理"]]}]}, {"title": "12.6 继承", "blocks": [{"t": "code", "c": "# 子类继承父类的所有属性和方法"}, {"t": "subtitle", "c": "class ElectricCar(Car):"}, {"t": "code", "c": "def __init__(self, brand, name, price, battery=100):\nsuper().__init__(brand, name, price)  # 调用父类 __init__\nself.battery = battery\ndef running(self):           # 重写（override）父类方法\nprint(f\"{self.brand} {self.name} 无声行驶...电量{self.battery}%\")\nec1 = ElectricCar(\"Tesla\", \"Model 3\", 300000)\nec1.running()"}]}]}, {"title": "第十三章：异常处理", "secs": [{"title": "13.1 try-except 完整语法", "blocks": [{"t": "subtitle", "c": "try:"}, {"t": "code", "c": "result = 10 / 0              # 可能出错的代码\nexcept ZeroDivisionError as e:  # 捕获特定异常\nprint(f\"除零错误：{e}\")\nexcept (ValueError, TypeError) as e:  # 捕获多种异常\nprint(f\"值/类型错误：{e}\")\nexcept Exception as e:          # 兜底：捕获所有异常\nprint(f\"未知错误：{e}\")"}, {"t": "subtitle", "c": "else:"}, {"t": "code", "c": "print(\"没有异常时执行，结果:\", result)"}, {"t": "subtitle", "c": "finally:"}, {"t": "code", "c": "print(\"无论是否异常都会执行（释放资源）\")"}]}, {"title": "13.2 实战示例", "blocks": [{"t": "subtitle", "c": "try:"}, {"t": "code", "c": "print(my_name)             # NameError：变量未定义"}, {"t": "subtitle", "c": "except NameError as e:"}, {"t": "code", "c": "print(f\"报错：{e}\")"}, {"t": "subtitle", "c": "finally:"}, {"t": "code", "c": "print(\"释放资源\")\nprint(\"程序继续执行...\")  # 异常被捕获，程序不中止"}]}, {"title": "13.3 常见异常类型速查", "blocks": [{"t": "table", "rows": [["异常类型", "触发条件"], ["NameError", "变量未定义"], ["TypeError", "类型不合适的操作（如 \"2\"+2）"], ["ValueError", "类型正确但值不合理（如 int(\"abc\")）"], ["ZeroDivisionError", "除以零"], ["IndexError", "列表索引越界"], ["KeyError", "字典 key 不存在"], ["FileNotFoundError", "打开不存在的文件"], ["AttributeError", "访问不存在的属性"], ["ImportError", "导入模块失败"]]}]}]}, {"title": "第十四章：文件操作", "secs": [{"title": "14.1 打开与关闭", "blocks": [{"t": "code", "c": "# 方式1：手动关闭（不推荐）\nf = open(\"test.txt\", \"r\", encoding=\"utf-8\")\ncontent = f.read()\nf.close()\n# 方式2：with 上下文管理器（强烈推荐）✅"}, {"t": "subtitle", "c": "with open(\"test.txt\", \"r\", encoding=\"utf-8\") as f:"}, {"t": "code", "c": "content = f.read()\n# 退出 with 块自动关闭，即使异常也会关闭"}, {"t": "tip", "c": "模式：\"r\" 读 | \"w\" 写(覆盖) | \"a\" 追加 | \"x\" 创建 | \"b\" 二进制 | \"+\" 读写"}]}, {"title": "14.2 读文件", "blocks": [{"t": "code", "c": "f.read()         # 读取整个文件\nf.readline()     # 读取一行（保留换行符）\nf.readlines()    # 读取所有行，返回列表\n# 逐行读取（推荐，节省内存）："}, {"t": "subtitle", "c": "with open(\"data.txt\", \"r\", encoding=\"utf-8\") as f:"}, {"t": "subtitle", "c": "for line in f:"}, {"t": "code", "c": "print(line.strip())"}]}, {"title": "14.3 写文件", "blocks": [{"t": "code", "c": "# 覆盖写入\nwith open(\"output.txt\", \"w\", encoding=\"utf-8\") as f:\nf.write(\"第一行\\n\")\n# 追加写入\nwith open(\"output.txt\", \"a\", encoding=\"utf-8\") as f:\nf.write(\"追加的内容\\n\")\n# 批量写入\nlines = [\"行1\", \"行2\", \"行3\"]\nwith open(\"output.txt\", \"w\", encoding=\"utf-8\") as f:\nf.writelines(line + \"\\n\" for line in lines)"}]}, {"title": "14.4 路径操作（pathlib 推荐）", "blocks": [{"t": "code", "c": "from pathlib import Path\np = Path(\"dir/subdir/file.txt\")\np.exists()      # 是否存在\np.is_file()     # 是否为文件\np.parent        # 父目录 → Path(\"dir/subdir\")\np.name          # 文件名 → \"file.txt\"\np.suffix        # 后缀 → \".txt\"\np.stem          # 无后缀名 → \"file\"\np.read_text()   # 读取文本\np.write_text(\"hello\")  # 写入文本"}, {"t": "tip", "c": "传统 os.path 方式仍在用，但新项目推荐用 pathlib（Python 3.4+）"}]}]}, {"title": "第十五章：常用技巧速查", "secs": [{"title": "15.1 列表/字典一键式操作", "blocks": [{"t": "code", "c": "# 生成数字列表：list(range(1, 11))\n# 列表去重：list(set(mylist))\n# 保序去重：list(dict.fromkeys(mylist))\n# 同时遍历多个列表："}, {"t": "subtitle", "c": "for name, score in zip(names, scores):"}, {"t": "code", "c": "print(f\"{name}: {score}\")\n# 合并列表为字典：dict(zip(keys, values))\n# 展平嵌套列表：[x for sub in lst for x in sub]\n# 统计出现次数：from collections import Counter; Counter(lst)"}]}, {"title": "15.2 字符串技巧", "blocks": [{"t": "code", "c": "\"hello\" in \"hello world\"      # 子串判断 → True\nf\"{3.14159:.1f}\"              # 保留一位小数 → \"3.1\"\nprint(\"-\" * 30)               # 输出 30 个 -"}]}, {"title": "15.3 IDE 快捷键", "blocks": [{"t": "code", "c": "Alt + Shift      # 多行列编辑\nCtrl + /         # 批量注释/取消注释\nAlt + ↑/↓        # 移动当前行"}]}, {"title": "15.4 一行代码技巧汇总", "blocks": [{"t": "code", "c": "a, b = b, a                         # 交换变量\nfor i, v in enumerate(lst):         # 索引+值遍历\nwith open(\"f.txt\") as f:            # 安全文件操作\n[x for x in lst if condition]       # 列表过滤"}]}]}, {"title": "第十六章：补充知识（手册扩展）", "secs": [{"title": "16.1 注释", "blocks": [{"t": "subtitle", "c": "单行注释"}, {"t": "code", "c": "# 这是单行注释，解释器会直接忽略\nx = 10          # 行尾注释也可以\n# 连续多个 # 就是多行注释\n# 第二行\n# 第三行"}, {"t": "subtitle", "c": "三引号多行注释"}, {"t": "code", "c": "\"\"\"\n也可以用三引号做多行说明\n本质是多行字符串，未赋值时被解释器忽略\n\"\"\""}, {"t": "subtitle", "c": "文档字符串 docstring（写在函数/类第一行）"}, {"t": "code", "c": "def add(a, b):\n    \"\"\"返回两个数的和\n\n    Args:\n        a: 第一个数\n        b: 第二个数\n    \"\"\"\n    return a + b\n\nprint(add.__doc__)    # 通过 __doc__ 访问文档\nhelp(add)             # help() 也会显示 docstring"}, {"t": "tip", "c": "注释写给三个月后的自己看，讲\"为什么这样做\"而不是\"做了什么\"。docstring 是函数的说明书，PyCharm 里悬停函数名即可看到。"}]}, {"title": "16.2 缩进与代码块", "blocks": [{"t": "code", "c": "if True:\n    print(\"缩进 4 空格\")     # 同一块内缩进必须一致\n    print(\"仍在块内\")\nprint(\"块外\")                 # 顶格 = 块结束"}, {"t": "code", "c": "if a:\n    x = 1\nelse:\n    x = 2\n    y = 3      # else 块内，注意对齐"}, {"t": "warn", "c": "缩进混用 Tab 和空格会报 TabError / IndentationError，PyCharm 默认自动把 Tab 转成 4 空格。PEP 8 推荐每级缩进 4 个空格。"}, {"t": "text", "c": "Python 用冒号 : 表示代码块开始，用缩进表示块的边界，没有大括号。缩进是语法的一部分，错了程序直接报错。"}]}, {"title": "16.3 多行语句", "blocks": [{"t": "code", "c": "# 方式1：反斜杠续行\ntotal = 1 + 2 + 3 + \\\n        4 + 5 + 6\n\n# 方式2：括号内直接换行（推荐）\ntotal = (1 + 2 + 3 +\n         4 + 5 + 6)\n\nmy_list = [\n    1, 2, 3,\n    4, 5,\n]"}, {"t": "tip", "c": "列表、元组、字典、函数调用的括号内可以自由换行，不需要反斜杠。反斜杠仅用于非括号场景。"}]}, {"title": "16.4 标识符与命名规范", "blocks": [{"t": "code", "c": "my_var = 1        # 字母开头 ✓\n_var = 2         # 下划线开头 ✓（约定：私有）\nvar2 = 3         # 可含数字 ✓\n# 2var = 4        # ❌ 数字不能开头\n# my-var = 5      # ❌ 不能有连字符\n# class = 6       # ❌ 不能是关键字"}, {"t": "code", "c": "import keyword\nprint(keyword.kwlist)   # 查看全部关键字，如 if/for/def/class"}, {"t": "table", "rows": [["对象", "规范", "示例"], ["变量", "小写+下划线 snake_case", "user_name"], ["常量", "全大写 UPPER_CASE", "MAX_SIZE"], ["函数", "小写+下划线", "get_user_name()"], ["类", "大驼峰 CamelCase", "UserProfile"], ["私有成员", "单下划线开头", "_internal"]]}, {"t": "tip", "c": "命名要见名知意，不要用 a、b、tmp 这类无意义名字（循环变量 i、j 除外）。"}]}, {"title": "16.5 常用内置函数速查", "blocks": [{"t": "table", "rows": [["函数", "作用", "示例"], ["print()", "输出", "print(1, 2, sep=',')"], ["len()", "长度", "len([1,2,3]) → 3"], ["type()", "查类型", "type(42) → int"], ["range()", "整数序列", "range(0, 10, 2)"], ["sum()", "求和", "sum([1,2,3]) → 6"], ["min()/max()", "最值", "max(3, 9, 2) → 9"], ["abs()", "绝对值", "abs(-5) → 5"], ["round()", "四舍五入", "round(3.14, 1) → 3.1"], ["sorted()", "排序(返回新列表)", "sorted([3,1,2])"], ["enumerate()", "索引+值", "enumerate(list)"], ["zip()", "并行打包", "zip(a, b)"], ["map()", "逐元素映射", "map(str, [1,2])"], ["filter()", "过滤", "filter(f, seq)"], ["int()/float()/str()", "类型转换", "int('42') → 42"], ["list()/tuple()/set()/dict()", "容器转换", "list('abc')"], ["bool()", "转布尔", "bool(0) → False"], ["any()/all()", "任一/全部为真", "all([1,1]) → True"], ["isinstance()", "类型判断", "isinstance(42, int)"], ["reversed()", "反向序列", "reversed([1,2,3])"]]}]}, {"title": "16.6 字符串编码 ord / chr", "blocks": [{"t": "code", "c": "ord(\"A\")    # 65      字符 → 编码\nchr(65)    # \"A\"     编码 → 字符\nord(\"中\")  # 20013"}, {"t": "code", "c": "s = \"你好\"\nb = s.encode(\"utf-8\")    # str → bytes\nprint(b)                  # b'\\xe4\\xbd\\xa0\\xe5\\xa5\\xbd'\ns2 = b.decode(\"utf-8\")   # bytes → str\nprint(s2)                 # 你好"}, {"t": "warn", "c": "读写文件出现乱码基本都是编码不一致：文件用 GBK 保存却用 UTF-8 打开。统一 encoding=\"utf-8\" 即可避免。"}]}, {"title": "16.7 join 高效拼接", "blocks": [{"t": "code", "c": "words = [\"我\", \"爱\", \"Python\"]\n\"\".join(words)        # \"我爱Python\"\n\"-\".join(words)       # \"我-爱-Python\"\n\", \".join([\"a\", \"b\"])  # \"a, b\"\n\" | \".join([\"x\", \"y\"])  # \"x | y\""}, {"t": "code", "c": "# ❌ 循环里用 + 拼接，每次创建新字符串，效率低\ns = \"\"\nfor w in words:\n    s += w\n# ✅ 用 join 一次完成\ns = \"\".join(words)"}, {"t": "tip", "c": "join 是字符串的方法，参数必须是字符串列表，元素不是字符串要先转换：\"\".join(map(str, nums))。"}]}, {"title": "16.8 浅拷贝与深拷贝", "blocks": [{"t": "code", "c": "import copy\na = [1, 2, [3, 4]]\nb = a[:]               # 浅拷贝：外层新列表，内层列表仍共享\nb = a.copy()           # 同上\nb = copy.copy(a)       # 浅拷贝\nc = copy.deepcopy(a)   # 深拷贝：完全独立的新对象"}, {"t": "code", "c": "a = [1, 2, [3, 4]]\nb = a.copy()\nb[2][0] = 99\nprint(a)   # [1, 2, [99, 4]]  ← 浅拷贝被连带修改！\n\nc = copy.deepcopy(a)\nc[2][0] = 0\nprint(a)   # [1, 2, [99, 4]]  ← 深拷贝不受影响"}, {"t": "warn", "c": "b = a 只是起别名（同一对象），改 b 就改 a。浅拷贝只复制第一层，嵌套的列表/字典仍共享；深拷贝完全独立。"}]}, {"title": "16.9 迭代器与生成器", "blocks": [{"t": "code", "c": "it = iter([1, 2, 3])\nnext(it)   # 1\nnext(it)   # 2\nnext(it)   # 3\n# next(it)  # ❌ 取完抛 StopIteration"}, {"t": "code", "c": "def gen():\n    yield 1      # 函数里有 yield 就是生成器\n    yield 2\n\nfor x in gen():\n    print(x)"}, {"t": "code", "c": "# 生成器表达式（惰性计算，省内存）\nsquares = (i**2 for i in range(1000000))\nprint(next(squares))   # 0\nprint(next(squares))   # 1"}, {"t": "tip", "c": "生成器惰性计算：用到才产出，不占内存，适合处理大文件、大数据流。range() 也是惰性的。"}]}, {"title": "16.10 装饰器", "blocks": [{"t": "code", "c": "def my_decorator(func):\n    def wrapper(*args, **kwargs):\n        print(\"函数执行前\")\n        result = func(*args, **kwargs)\n        print(\"函数执行后\")\n        return result\n    return wrapper\n\n@my_decorator          # 等价于 say_hi = my_decorator(say_hi)\ndef say_hi(name):\n    print(f\"你好 {name}\")\n\nsay_hi(\"小明\")\n# 函数执行前\n# 你好 小明\n# 函数执行后"}, {"t": "code", "c": "import time, functools\n\ndef timer(func):\n    @functools.wraps(func)      # 保留原函数名和 docstring\n    def wrapper(*a, **k):\n        t0 = time.time()\n        r = func(*a, **k)\n        print(f\"{func.__name__} 耗时 {time.time()-t0:.4f}s\")\n        return r\n    return wrapper\n\n@timer\ndef calc():\n    time.sleep(0.1)\n\ncalc()"}, {"t": "text", "c": "装饰器给已有函数加通用功能（日志、计时、权限校验），不用改原函数代码。"}]}, {"title": "16.11 类方法、静态方法与 property", "blocks": [{"t": "code", "c": "class Student:\n    count = 0                    # 类属性\n\n    def __init__(self, name):\n        self.name = name\n        Student.count += 1\n\n    @classmethod                 # 类方法：第一参数是类本身 cls\n    def total(cls):\n        return f\"共 {cls.count} 个学生\"\n\n    @staticmethod                # 静态方法：不需要 self/cls\n    def is_valid_name(name):\n        return len(name) >= 2\n\n    @property                    # 属性装饰器：方法当属性用\n    def info(self):\n        return f\"学生 {self.name}\""}, {"t": "code", "c": "s = Student(\"小明\")\nprint(Student.total())             # 共 1 个学生\nprint(Student.is_valid_name(\"小\"))  # False\nprint(s.info)                      # 不用加括号"}, {"t": "tip", "c": "类方法用于访问/修改类属性、工厂方法；静态方法只是放在类里的普通函数；@property 让读取像属性，还能配套 @xxx.setter 拦截赋值。"}]}, {"title": "16.12 pip 与虚拟环境", "blocks": [{"t": "code", "c": "pip install numpy                # 安装包\npip install numpy==1.26.4         # 指定版本\npip uninstall numpy               # 卸载\npip list                          # 查看已装包\npip freeze > requirements.txt     # 导出依赖清单\npip install -r requirements.txt   # 按清单批量安装"}, {"t": "code", "c": "# 创建虚拟环境（每个项目独立的包环境）\npython -m venv myenv\n# Linux / Mac 激活：\nsource myenv/bin/activate\n# Windows 激活：\nmyenv\\Scripts\\activate"}, {"t": "tip", "c": "每个项目用独立虚拟环境是好习惯，避免不同项目间的包版本冲突。国内加速：pip install xxx -i https://pypi.tuna.tsinghua.edu.cn/simple"}]}, {"title": "16.13 四大序列类型怎么选", "blocks": [{"t": "table", "rows": [["类型", "有序", "可修改", "元素可重复", "典型场景"], ["list 列表", "✓", "✓", "✓", "需要增删改、遍历的集合"], ["tuple 元组", "✓", "✗", "✓", "固定不变的数据，如坐标、配置"], ["set 集合", "✗", "✓", "✗", "去重、成员判断、交并差"], ["dict 字典", "✓(3.7+)", "✓", "key 不可重复", "key→value 查找、计数"]]}, {"t": "tip", "c": "不确定就用 list；数据不应被改就用 tuple；要快速判断\"在不在\"用 set（O(1) 查找）；要通过名字取数据用 dict。"}]}, {"title": "16.14 作用域 LEGB 与 nonlocal", "blocks": [{"t": "code", "c": "x = \"全局\"\n\ndef outer():\n    x = \"外层函数\"\n    def inner():\n        nonlocal x        # 修改外层函数的变量\n        x = \"被 inner 修改\"\n    inner()\n    print(x)              # 被 inner 修改\n\nouter()\nprint(x)                  # 全局（未变）"}, {"t": "text", "c": "变量查找顺序 LEGB：Local（函数内）→ Enclosing（外层函数）→ Global（模块全局）→ Built-in（内建）。global 声明改全局变量，nonlocal 声明改外层函数的变量。"}]}, {"title": "16.15 可变对象默认参数陷阱", "blocks": [{"t": "code", "c": "def append_item(item, lst=[]):    # ❌ 默认参数只在定义时创建一次！\n    lst.append(item)\n    return lst\n\nprint(append_item(1))   # [1]\nprint(append_item(2))   # [1, 2]  ← 第二次调用带了上次的结果"}, {"t": "code", "c": "def append_item(item, lst=None):   # ✅ 推荐写法\n    if lst is None:\n        lst = []\n    lst.append(item)\n    return lst"}, {"t": "warn", "c": "默认参数不要用可变对象（list/dict/set），一律用 None 占位，函数体内再创建。"}]}, {"title": "16.16 is 与 == 的区别", "blocks": [{"t": "code", "c": "a = [1, 2]\nb = [1, 2]\nprint(a == b)   # True   == 比较值\nprint(a is b)   # False  is 比较身份（是否同一个对象）\n\nc = a\nprint(c is a)   # True\nprint(id(a), id(b))   # id() 查看内存地址"}, {"t": "tip", "c": "一般比较用 ==；判断是否为 None 用 is：if x is None:。小整数和短字符串有缓存，is 结果可能\"碰巧\"为 True，不要依赖。"}]}, {"title": "16.17 字符串前缀、字典合并、海象运算符", "blocks": [{"t": "subtitle", "c": "字符串前缀"}, {"t": "code", "c": "name = \"Alice\"\ns1 = f\"{name}\"          # f: 格式化\ns2 = r\"C:\\Users\"        # r: 原始字符串，不转义\ns3 = b\"bytes\"           # b: 字节串\ns4 = u\"unicode\"         # u: unicode 字符串（默认已是）"}, {"t": "subtitle", "c": "字典合并（Python 3.9+）"}, {"t": "code", "c": "d1 = {\"a\": 1}\nd2 = {\"b\": 2}\nmerged = d1 | d2        # {\"a\": 1, \"b\": 2}\nprint(merged)"}, {"t": "subtitle", "c": "海象运算符 :=（Python 3.8+）"}, {"t": "code", "c": "# 在表达式内同时赋值和判断\nif (n := len(my_list)) > 10:\n    print(f\"列表有 {n} 个元素\")\n\n# 常用于 while 循环\nwhile (line := f.readline()):\n    print(line.strip())"}, {"t": "tip", "c": "海象运算符能在 if / while 条件里顺手赋值，减少重复代码，但别滥用影响可读性。"}]}, {"title": "16.18 常用标准库速查", "blocks": [{"t": "code", "c": "import os                  # 系统操作\nos.path.exists(\"a.txt\")     # 文件是否存在\nos.getcwd()                 # 当前工作目录\nos.listdir(\".\")             # 列出目录内容\n\nimport json                # JSON 读写\njson.dumps({\"a\": 1})        # 字典 → JSON 字符串\njson.loads('{\"a\": 1}')      # JSON 字符串 → 字典\n\nimport datetime            # 日期时间\ndatetime.datetime.now()    # 当前时间\n\nimport time                # 时间与延时\ntime.sleep(1)              # 暂停 1 秒\ntime.time()                # 时间戳\n\nimport math                # 数学函数\nmath.sqrt(16)              # 4.0\nmath.pi                    # 3.14159..."}, {"t": "tip", "c": "标准库是官方内置的\"电池\"，import 即用无需安装。random 随机数模块见第四章 4.5。"}]}, {"title": "16.19 代码风格 PEP 8", "blocks": [{"t": "code", "c": "# 好的风格\nMAX_SIZE = 100                   # 常量全大写\n\n\ndef get_user_name(user_id):      # 函数 snake_case\n    \"\"\"获取用户名\"\"\"\n    return str(user_id)\n\n\nclass UserProfile:               # 类 CamelCase\n    pass\n\nresult = 1 + 2                   # 运算符两边加空格"}, {"t": "tip", "c": "PEP 8 要点：变量/函数 snake_case；类 CamelCase；常量 UPPER_CASE；运算符两边空格；每行 ≤ 79 字符；缩进 4 空格。PyCharm 会黄色波浪线自动提示。"}]}, {"title": "16.20 常见报错排查速查", "blocks": [{"t": "code", "c": "# NameError: name 'xxx' is not defined\n#   → 变量未定义就使用，或拼写错误\n#\n# IndexError: list index out of range\n#   → 下标越界，索引超出列表长度\n#\n# KeyError: 'xxx'\n#   → 字典没有这个 key，改用 .get() 安全取值\n#\n# TypeError: can only concatenate str (not \"int\") to str\n#   → 类型不匹配，str 和 int 不能直接 +，先 str() 转换\n#\n# AttributeError: 'list' object has no attribute 'xxx'\n#   → 对象没有这个方法/属性，可能用错类型或拼写错误"}, {"t": "warn", "c": "报错时看 Traceback 的最后一行：那是真正的错误类型和位置。从下往上看，找到你自己写的代码那行，就是问题所在。"}]}]}, {"title": "附录：原文档常见错误修正对照表", "secs": [{"title": "原文档常见错误修正对照表", "blocks": [{"t": "table", "rows": [["原文档写法", "错误原因", "正确写法"], ["Print()", "Python 严格区分大小写", "print()"], ["Input()", "Python 严格区分大小写", "input()"], ["Isinstance()", "Python 严格区分大小写", "isinstance()"], ["%S（大写）", "格式化占位符必须小写", "%s（小写）"], ["// 注释", "Python 注释用 #", "# 注释"], ["Nne", "拼写错误", "None"], ["{} 空集合", "{} 是空字典", "set() 创建空集合"], ["单元素元组 (100)", "不加逗号视为普通括号", "(100,) 加逗号"], ["Input = (提示)", "input 是函数不是变量", "input(\"提示内容\")"], ["def f(a,f=0,g)", "默认参数必须在最后", "def f(a,g,f=0)"]]}]}]}];

const content = document.getElementById('content');
const toc = document.getElementById('toc');
const kw = document.getElementById('kw');
const stat = document.getElementById('stat');
const topBtn = document.getElementById('topBtn');

const cache = {};
let totalSecs = 0;

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function colorize(code) {
  return esc(code).replace(/(#[^\n]*)/g, '<span class="cmt">$1</span>');
}
function blockHTML(b) {
  switch (b.t) {
    case 'code':
      return '<div class="code-wrap"><pre><code>' + colorize(b.c) + '</code></pre><button class="copy-btn">复制</button></div>';
    case 'tip':
      return '<div class="tip">💡 ' + esc(b.c) + '</div>';
    case 'warn':
      return '<div class="warn">⚠️ ' + esc(b.c) + '</div>';
    case 'subtitle':
      return '<div class="subtitle">' + esc(b.c) + '</div>';
    case 'table':
      return '<table class="tbl">' + b.rows.map((r, i) =>
        '<tr>' + r.map(c => '<' + (i === 0 ? 'th' : 'td') + '>' + esc(c) + '</' + (i === 0 ? 'th' : 'td') + '>').join('') + '</tr>').join('') + '</table>';
    default:
      return '<p>' + esc(b.c) + '</p>';
  }
}
function render() {
  let html = '';
  let tocHtml = '';
  DATA.forEach((ch, ci) => {
    html += '<section class="chapter" id="ch-' + ci + '"><h2 class="ch-title">' + esc(ch.title) + '</h2>';
    tocHtml += '<a class="ch-link" href="#ch-' + ci + '">' + esc(ch.title) + '</a>';
    ch.secs.forEach((s, si) => {
      const id = 'sec-' + ci + '-' + si;
      const body = s.blocks.map(blockHTML).join('');
      html += '<div class="card" id="' + id + '" data-ch="' + ci + '"><h3>' + esc(s.title) + '</h3><div class="blocks">' + body + '</div></div>';
      tocHtml += '<a class="sec-link" href="#' + id + '">' + esc(s.title) + '</a>';
      cache[id] = body;
      totalSecs++;
    });
    html += '</section>';
  });
  content.innerHTML = html;
  toc.innerHTML = tocHtml;
  stat.textContent = '共 ' + totalSecs + ' 个小节';
}
render();

kw.addEventListener('input', () => {
  const q = kw.value.trim().toLowerCase();
  const cards = document.querySelectorAll('#content .card');
  let shown = 0;
  cards.forEach(card => {
    const id = card.id;
    card.querySelector('.blocks').innerHTML = cache[id];
    const key = (card.dataset.ch + ' ' + card.textContent).toLowerCase();
    if (!q || key.includes(q)) {
      card.style.display = '';
      shown++;
      if (q) highlight(card, q);
    } else {
      card.style.display = 'none';
    }
  });
  document.querySelectorAll('#content .chapter').forEach(ch => {
    ch.style.display = [...ch.querySelectorAll('.card')].some(c => c.style.display !== 'none') ? '' : 'none';
  });
  stat.textContent = q ? '匹配 ' + shown + ' / ' + totalSecs + ' 个小节' : '共 ' + totalSecs + ' 个小节';
  if (!q) {
    toc.querySelectorAll('a').forEach(a => a.style.display = '');
  } else {
    toc.querySelectorAll('.sec-link').forEach(a => {
      const id = a.getAttribute('href').slice(1);
      const card = document.getElementById(id);
      a.style.display = card && card.style.display !== 'none' ? '' : 'none';
    });
    toc.querySelectorAll('.ch-link').forEach(a => {
      const id = a.getAttribute('href').slice(1);
      const ch = document.getElementById(id);
      a.style.display = ch && ch.style.display !== 'none' ? '' : 'none';
    });
  }
});

let enterIdx = 0;
kw.addEventListener('input', () => { enterIdx = 0; });
kw.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const cards = [...document.querySelectorAll('#content .card')].filter(c => c.style.display !== 'none');
  if (!cards.length) return;
  if (enterIdx >= cards.length) enterIdx = 0;
  const target = cards[enterIdx];
  target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  cards.forEach(c => c.classList.remove('enter-hit'));
  target.classList.add('enter-hit');
  enterIdx++;
});

function highlight(root, q) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(tn => {
    const v = tn.nodeValue;
    const lower = v.toLowerCase();
    if (!lower.includes(q)) return;
    const frag = document.createDocumentFragment();
    let i = 0, idx;
    while ((idx = lower.indexOf(q, i)) !== -1) {
      frag.appendChild(document.createTextNode(v.slice(i, idx)));
      const m = document.createElement('mark');
      m.textContent = v.slice(idx, idx + q.length);
      frag.appendChild(m);
      i = idx + q.length;
    }
    frag.appendChild(document.createTextNode(v.slice(i)));
    tn.parentNode.replaceChild(frag, tn);
  });
}

document.addEventListener('click', e => {
  if (e.target.classList.contains('copy-btn')) {
    const code = e.target.parentElement.querySelector('code').textContent;
    const done = () => { e.target.textContent = '已复制'; setTimeout(() => e.target.textContent = '复制', 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
    } else {
      fallbackCopy(code, done);
    }
  }
});
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  ta.remove();
}

const pyPane = document.getElementById('pane-py');
pyPane.addEventListener('scroll', () => {
  topBtn.style.display = pyPane.scrollTop > 400 ? 'block' : 'none';
});
topBtn.addEventListener('click', () => pyPane.scrollTo({ top: 0, behavior: 'smooth' }));
})();</script>
<script>(function(){
const DATA = [{"title": "一、工作空间创建与编译", "intro": "工作空间（workspace）是 ROS2 项目的根目录，所有功能包都放在 src/ 子目录下。编译使用 colcon 构建工具。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "mkdir -p <工作空间名>/src", "desc": "递归创建工作空间目录结构\n<工作空间名>：自定义文件夹名，如 my_ws", "use": "创建目录"}, {"cmd": "cd <工作空间名>", "desc": "进入工作空间根目录\n后续所有 colcon 命令均需在此目录执行", "use": "切换目录"}, {"cmd": "colcon build", "desc": "编译工作空间中所有功能包\n编译完成后生成 build/ install/ log/ 三个目录", "use": "编译工作空间"}, {"cmd": "colcon build --packages-select <包名>", "desc": "只编译指定的功能包\n<包名>：目标功能包名", "use": "编译指定包"}, {"cmd": "colcon build --packages-up-to <包名>", "desc": "编译指定包及其所有依赖包（按依赖顺序）\n适合刚 clone 新包后首次编译", "use": "编译包及依赖"}, {"cmd": "colcon build --packages-skip <包名>", "desc": "跳过指定包不编译\n<包名>：要跳过的包名", "use": "跳过编译"}, {"cmd": "colcon build --symlink-install", "desc": "★ 符号链接安装——Python 代码修改后无需重新编译即生效\n开发阶段强烈推荐", "use": "开发模式编译"}, {"cmd": "colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release", "desc": "传递 CMake 编译参数给 C++ 包\nRelease 模式获得最佳运行性能", "use": "C++ 编译参数"}, {"cmd": "colcon build --event-handlers console_direct+", "desc": "编译时直接在终端输出所有日志\n方便查看警告和错误信息", "use": "查看编译日志"}, {"cmd": "source <工作空间名>/install/setup.bash", "desc": "运行安装脚本，将工作空间中的包注册到环境变量\n⚠️ 每次新开终端都要重新执行一次", "use": "环境配置"}, {"cmd": "echo \"source ~/<工作空间名>/install/setup.bash\" >> ~/.bashrc", "desc": "将 source 命令写入 .bashrc 实现开机自动生效\n不必每次手动 source", "use": "写入文件"}, {"cmd": "printenv | grep ROS", "desc": "查看所有 ROS 相关的环境变量", "use": "查看环境变量"}, {"cmd": "export <变量名>=<新路径>:$<变量名>", "desc": "手动追加环境变量\n<变量名>：如 PYTHONPATH\n<新路径>：要添加的路径", "use": "设置环境变量"}, {"cmd": "rm -rf build/ install/ log/", "desc": "删除所有编译产物，相当于清空后重新来\n⚠️ 不可恢复，慎重使用", "use": "删除"}]}, {"t": "tip", "c": "colcon build 默认使用 --merge-install；加 --symlink-install 后 Python 包以符号链接方式安装，修改 .py 文件无需重新编译。"}]}, {"title": "二、功能包创建与管理", "intro": "功能包（package）是 ROS2 代码组织的最小单元，每个包有自己的 package.xml 描述文件。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "ros2 pkg create --build-type ament_python <包名>", "desc": "创建 Python 功能包\n<包名>：如 demo_python_pkg\n\n目录结构：\n<包名>/\n├── package.xml\n├── setup.py\n├── setup.cfg\n└── <包名>/__init__.py", "use": "创建功能包"}, {"cmd": "ros2 pkg create --build-type ament_cmake <包名>", "desc": "创建 C++ 功能包\n<包名>：如 demo_cpp_pkg\n\n目录结构：\n<包名>/\n├── package.xml\n├── CMakeLists.txt\n├── include/<包名>/\n└── src/", "use": "创建功能包"}, {"cmd": "ros2 pkg create <包名> --dependencies <依赖1> <依赖2>", "desc": "创建包时声明依赖\n自动写入 package.xml 的 <depend> 标签\n如 --dependencies rclpy std_msgs", "use": "创建功能包"}, {"cmd": "ros2 pkg create <包名> --license Apache-2.0", "desc": "创建包时指定许可证\n常用：Apache-2.0 / MIT / GPL-3.0", "use": "创建功能包"}, {"cmd": "ros2 pkg create <包名> --node-name <节点名>", "desc": "创建包同时生成节点代码模板\n会在包目录下创建 <节点名>.py 文件", "use": "创建功能包"}, {"cmd": "ros2 pkg list", "desc": "列出当前环境中所有可用的功能包", "use": "通用操作"}, {"cmd": "ros2 pkg executables <包名>", "desc": "列出指定包中可执行文件（即可用 ros2 run 启动的程序）", "use": "通用操作"}, {"cmd": "ros2 pkg xml <包名>", "desc": "查看包的 package.xml 内容", "use": "通用操作"}, {"cmd": "mv <包文件夹>/ <目标路径>/", "desc": "将功能包文件夹移动到指定目录\n如 mv my_pkg ~/my_ws/src/", "use": "移动/重命名"}, {"cmd": "# 手动在 package.xml 中添加：\n<depend>demo_cpp_pkg</depend>", "desc": "手动声明依赖关系\n编译时被依赖的包会先编译", "use": "通用操作"}]}, {"t": "tip", "c": "Python 包的 __init__.py 不能省略，否则 Python 无法识别该目录为包。"}]}, {"title": "三、节点（Node）操作", "intro": "节点是 ROS2 中最小的执行单元，每个节点通常负责一个独立功能。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "ros2 run <包名> <可执行文件名>", "desc": "运行功能包中的节点程序\n<可执行文件名>：setup.py 中注册的名字\n示例：ros2 run demo_python_pkg talker", "use": "运行节点"}, {"cmd": "ros2 run <包名> <可执行文件名> --ros-args -r __node:=<新节点名>", "desc": "运行节点并重命名\n示例：--ros-args -r __node:=my_talker", "use": "运行节点"}, {"cmd": "ros2 run <包名> <可执行文件名> --ros-args -p <参数名>:=<值>", "desc": "运行节点时传入参数\n示例：-p my_param:=hello", "use": "运行节点"}, {"cmd": "ros2 run <包名> <可执行文件名> --ros-args --remap <旧话题>:=<新话题>", "desc": "运行节点时重映射话题名\n--remap /cmd_vel:=/new_cmd_vel", "use": "运行节点"}, {"cmd": "ros2 node list", "desc": "列出当前所有运行中的节点", "use": "查看节点列表"}, {"cmd": "ros2 node list -a", "desc": "列出所有节点（包括隐藏节点）", "use": "查看所有节点"}, {"cmd": "ros2 node info <节点名>", "desc": "查看节点详细信息：\n- 订阅/发布的话题\n- 提供的服务\n- 可用的动作\n- 参数列表\n示例：ros2 node info /turtlesim", "use": "查看节点详情"}]}]}, {"title": "四、话题（Topic）操作", "intro": "话题是 ROS2 中节点间通信的主要方式，基于发布-订阅模型，单向数据传输。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "ros2 topic list", "desc": "列出当前所有活跃话题", "use": "查看话题列表"}, {"cmd": "ros2 topic list -t", "desc": "列出话题并同时显示消息类型", "use": "查看话题列表"}, {"cmd": "ros2 topic echo <话题名>", "desc": "订阅并实时打印话题内容\n示例：ros2 topic echo /turtle1/pose\n按 Ctrl+C 停止", "use": "监听话题内容"}, {"cmd": "ros2 topic info <话题名>", "desc": "查看话题详情：消息类型、发布者数量、订阅者数量", "use": "查看话题详情"}, {"cmd": "ros2 topic hz <话题名>", "desc": "显示话题实时发布频率（Hz）", "use": "监测发布频率"}, {"cmd": "ros2 topic bw <话题名>", "desc": "显示话题带宽占用（bytes/s）", "use": "监测带宽"}, {"cmd": "ros2 topic find <消息类型>", "desc": "查找使用指定消息类型的所有话题", "use": "查找话题"}, {"cmd": "ros2 topic pub <话题名> <消息类型> '<消息内容>'", "desc": "向话题发布一条消息（发布后不退出，需 Ctrl+C）\n消息内容为 YAML 格式，用单引号括起来\n示例：\nros2 topic pub /turtle1/cmd_vel geometry_msgs/msg/Twist \\\n'{linear: {x: 2.0}, angular: {z: 1.5}}'", "use": "发布消息"}, {"cmd": "ros2 topic pub --rate <频率> <话题名> <消息类型> '<消息内容>'", "desc": "以指定频率持续发布\n--rate 10 表示每秒 10 次", "use": "发布消息"}, {"cmd": "ros2 topic pub --once <话题名> <消息类型> '<消息内容>'", "desc": "只发布一次后立即退出", "use": "发布消息"}]}]}, {"title": "五、接口（Interface）操作", "intro": "接口定义了消息（msg）、服务（srv）、动作（action）的数据结构。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "ros2 interface list", "desc": "列出所有接口（msg / srv / action）", "use": "列出接口"}, {"cmd": "ros2 interface list -m", "desc": "只列出消息接口（msg）", "use": "列出接口"}, {"cmd": "ros2 interface list -s", "desc": "只列出服务接口（srv）", "use": "列出接口"}, {"cmd": "ros2 interface list -a", "desc": "只列出动作接口（action）", "use": "列出接口"}, {"cmd": "ros2 interface show <接口类型>", "desc": "查看接口字段定义\n示例：ros2 interface show geometry_msgs/msg/Twist", "use": "查看接口定义"}, {"cmd": "ros2 interface proto <接口类型>", "desc": "查看接口模板（可直接复制填入 pub 命令）\n示例：ros2 interface proto geometry_msgs/msg/Twist", "use": "查看接口模板"}, {"cmd": "ros2 interface packages", "desc": "列出所有提供了接口定义的功能包", "use": "查看接口包"}]}]}, {"title": "六、服务（Service）操作", "intro": "服务基于请求-响应模型，客户端发送请求，服务端处理并返回结果（双向一次性通信）。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "ros2 service list", "desc": "列出当前所有可用服务", "use": "列出服务"}, {"cmd": "ros2 service list -t", "desc": "列出服务及其对应类型", "use": "列出服务"}, {"cmd": "ros2 service type <服务名>", "desc": "查看服务的类型", "use": "查看服务类型"}, {"cmd": "ros2 service find <服务类型>", "desc": "查找使用指定类型的服务", "use": "查找服务"}, {"cmd": "ros2 service call <服务名> <服务类型> '<请求数据>'", "desc": "调用服务发送请求并接收响应\n示例（生成新乌龟）：\nros2 service call /spawn turtlesim/srv/Spawn \\\n'{x: 5.0, y: 3.0, theta: 0.0, name: turtle2}'", "use": "调用服务"}]}]}, {"title": "七、参数（Parameter）操作", "intro": "参数用于存储节点的运行配置，可在运行时动态修改，支持类型检查。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "ros2 param list", "desc": "列出所有节点的参数", "use": "列出参数"}, {"cmd": "ros2 param get <节点名> <参数名>", "desc": "获取参数值", "use": "读取参数"}, {"cmd": "ros2 param set <节点名> <参数名> <参数值>", "desc": "动态设置参数（运行时实时生效）\n示例：ros2 param set /turtlesim background_r 255", "use": "设置参数"}, {"cmd": "ros2 param dump <节点名>", "desc": "导出节点所有参数为 YAML 文件到当前目录\n导出文件可被 load 命令读取", "use": "导出参数"}, {"cmd": "ros2 param load <节点名> <yaml文件路径>", "desc": "从 YAML 文件批量加载参数", "use": "批量加载参数"}, {"cmd": "ros2 param delete <节点名> <参数名>", "desc": "删除节点的某个参数", "use": "删除参数"}, {"cmd": "ros2 param describe <节点名> <参数名>", "desc": "查看参数描述：类型、取值范围等", "use": "查看参数详情"}]}]}, {"title": "八、动作（Action）操作", "intro": "动作用于长时间运行的任务，支持中途取消和实时反馈（异步任务），如导航、机械臂运动。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "ros2 action list", "desc": "列出当前所有动作", "use": "列出动作"}, {"cmd": "ros2 action list -t", "desc": "列出动作及其类型", "use": "列出动作"}, {"cmd": "ros2 action info <动作名>", "desc": "查看动作详情：客户端/服务器数量", "use": "查看动作详情"}, {"cmd": "ros2 action send_goal <动作名> <动作类型> '<目标数据>'", "desc": "发送目标任务给动作服务器\n目标数据为 YAML 格式", "use": "发送目标"}, {"cmd": "ros2 action send_goal <动作名> <动作类型> '<目标数据>' --feedback", "desc": "发送目标并实时显示执行反馈信息", "use": "发送目标"}]}]}, {"title": "九、Bag 录制与回放", "intro": "ros2 bag 用于录制和回放话题数据，方便离线分析、测试复现。数据以 SQLite 格式存储。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "ros2 bag record <话题1> <话题2> ...", "desc": "录制指定话题数据\n数据保存在 rosbag2_YYYY_MM_DD-HH_MM_SS 文件夹中", "use": "录制数据"}, {"cmd": "ros2 bag record -a", "desc": "录制所有话题\n⚠️ 数据量可能非常庞大，谨慎使用", "use": "录制数据"}, {"cmd": "ros2 bag record -o <输出文件名> <话题名>", "desc": "录制话题并指定输出文件夹名", "use": "录制数据"}, {"cmd": "ros2 bag record --max-bag-size <大小> <话题名>", "desc": "限制单个 bag 文件最大大小，超限自动分割\n如 --max-bag-size 100M", "use": "录制数据"}, {"cmd": "ros2 bag play <bag文件夹>", "desc": "回放录制的 bag 数据", "use": "回放数据"}, {"cmd": "ros2 bag play <bag文件夹> --rate <倍速>", "desc": "以指定倍速回放\n1.0=原速 2.0=两倍速 0.5=半速", "use": "回放数据"}, {"cmd": "ros2 bag play <bag文件夹> --loop", "desc": "循环回放（录制一次，反复播放）", "use": "回放数据"}, {"cmd": "ros2 bag info <bag文件夹>", "desc": "查看 bag 元信息：录制时长、话题数量、消息总数", "use": "查看录制信息"}]}, {"t": "tip", "c": "ROS2 的 bag 格式为 mcap（默认，Humble+）或 sqlite3，与 ROS1 的 .bag 不兼容。"}]}, {"title": "十、Launch 启动文件", "intro": "Launch 文件可一次性启动多个节点，支持参数配置、条件启动、命名空间隔离。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式 / 代码片段", "desc": "说明", "use": "通用操作"}, {"cmd": "ros2 launch <包名> <launch文件名>", "desc": "执行 launch 文件\n<launch文件名>：如 talker_listener.launch.py", "use": "批量启动节点"}, {"cmd": "from launch import LaunchDescription", "desc": "Launch 文件必须导入的基类", "use": "Launch 导入"}, {"cmd": "from launch_ros.actions import Node", "desc": "导入 Node 启动动作，用于定义要启动的节点", "use": "Launch 导入"}, {"cmd": "from launch.substitutions import LaunchConfiguration\nfrom launch.actions import DeclareLaunchArgument", "desc": "导入可配置参数模块", "use": "Launch 导入"}, {"cmd": "Node(\n  package='<包名>',\n  executable='<可执行文件名>',\n  name='<节点名>',\n  output='screen'\n)", "desc": "在 launch 中定义一个节点\noutput=\"screen\"：终端输出可见\nname 可与 executable 不同", "use": "Launch 定义节点"}, {"cmd": "Node(\n  ...,\n  parameters=[{'<参数名>': <参数值>}]\n)", "desc": "在 launch 中为节点设置参数\n示例：parameters=[{\"use_sim_time\": True}]", "use": "Launch 定义节点"}, {"cmd": "Node(\n  ...,\n  remappings=[('/<旧话题>', '/<新话题>')]\n)", "desc": "在 launch 中重映射话题", "use": "Launch 定义节点"}, {"cmd": "DeclareLaunchArgument(\n  '<参数名>',\n  default_value='<默认值>'\n)", "desc": "声明可调命令行参数\n引用：LaunchConfiguration(\"<参数名>\")\n覆盖：ros2 launch <包> <文件> <参数名>:=新值", "use": "Launch 声明参数"}]}, {"t": "tip", "c": "Launch 文件必须以 .launch.py 结尾，且需在 CMakeLists.txt 或 setup.py 中正确安装到 install 目录。"}]}, {"title": "十一、Python 节点编程常用代码", "intro": "以下是编写 ROS2 Python 节点时最常用的代码模式，涵盖发布者、订阅者、定时器、程序入口等。", "blocks": [{"t": "cmds", "items": [{"cmd": "代码片段", "desc": "说明", "use": "通用操作"}, {"cmd": "import rclpy\nfrom rclpy.node import Node", "desc": "导入 ROS2 Python 客户端库和 Node 基类\n所有 ROS2 Python 节点必须继承 Node", "use": "导入客户端库"}, {"cmd": "from <接口包名>.msg import <消息类名>", "desc": "导入消息类型\n示例：from example_interfaces.msg import String", "use": "导入消息类型"}, {"cmd": "class <类名>(Node):\n    def __init__(self):\n        super().__init__('<节点名>')", "desc": "创建节点类，继承 Node\n<节点名>：节点的显示名称（字符串）\n必须调用 super().__init__() 初始化", "use": "定义节点类"}, {"cmd": "# 创建发布者\nself.pub = self.create_publisher(\n    <消息类名>, '<话题名>', 10)", "desc": "创建发布者\n参数：消息类型 / 话题名 / QoS 队列深度（10）", "use": "通用操作"}, {"cmd": "# 发布消息（三步）\nmsg = <消息类名>()\nmsg.data = '<内容>'\nself.pub.publish(msg)", "desc": "发布消息标准三步流程\n示例：\nmsg = String()\nmsg.data = \"Hello ROS2\"\nself.pub.publish(msg)", "use": "通用操作"}, {"cmd": "# 创建订阅者\nself.sub = self.create_subscription(\n    <消息类名>, '<话题名>', self.<回调函数>, 10)", "desc": "创建订阅者监听话题\n回调函数签名：def xxx(self, msg):\n收到消息时自动调用", "use": "通用操作"}, {"cmd": "# 创建定时器\nself.timer = self.create_timer(\n    <周期秒数>, self.<回调函数>)", "desc": "创建定时器按固定间隔执行回调\n如 0.5 表示每 0.5 秒执行一次", "use": "通用操作"}, {"cmd": "# 创建服务端\nself.srv = self.create_service(\n    <服务类型>, \"<服务名>\", self.<回调>)", "desc": "创建服务端\n回调函数签名：def xxx(self, request, response):\n需要返回 response 对象", "use": "通用操作"}, {"cmd": "# 创建客户端\nself.cli = self.create_client(\n    <服务类型>, \"<服务名>\")", "desc": "创建服务客户端\n调用需配合 while not self.cli.wait_for_service(timeout_sec=1.0)", "use": "通用操作"}, {"cmd": "def main(args=None):\n    rclpy.init(args=args)\n    node = <类名>()\n    rclpy.spin(node)\n    rclpy.shutdown()", "desc": "★ Main 函数标准模板\nrclpy.spin() 让节点持续运行处理回调", "use": "程序入口"}, {"cmd": "# setup.py 注册可执行文件\nentry_points={\n    'console_scripts': [\n        '<命令名> = <包名>.<模块名>:main',\n    ],\n}", "desc": "在 setup.py 中注册可执行入口\n<命令名>：ros2 run 时输入的名字\n<模块名>：包含 main 的 .py 文件（不含后缀）\n编译后生成到 install/lib/", "use": "通用操作"}]}, {"t": "warn", "c": "️ 切勿在回调函数中执行长时间阻塞操作（如 sleep），会阻塞整个节点的回调处理。应使用异步或独立线程。"}]}, {"title": "十二、调试与可视化工具", "intro": "ROS2 提供丰富的 GUI 工具用于调试、可视化和系统监控。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "ros2 run rqt_graph rqt_graph", "desc": "rqt_graph：节点关系图\n用图形界面显示节点和话题的连接关系，非常直观", "use": "运行节点"}, {"cmd": "ros2 run rqt_plot rqt_plot", "desc": "rqt_plot：实时绘制话题数据波形图", "use": "运行节点"}, {"cmd": "ros2 run rqt_console rqt_console", "desc": "rqt_console：日志控制台\n按级别过滤和查看 ROS2 日志", "use": "运行节点"}, {"cmd": "ros2 run rqt_reconfigure rqt_reconfigure", "desc": "rqt_reconfigure：动态调参可视化（需节点支持）", "use": "运行节点"}, {"cmd": "ros2 run turtlesim turtlesim_node", "desc": "小乌龟仿真节点——ROS2 官方学习工具", "use": "运行节点"}, {"cmd": "ros2 run turtlesim turtle_teleop_key", "desc": "键盘遥控小乌龟（方向键操控）", "use": "运行节点"}, {"cmd": "rviz2", "desc": "3D 可视化工具（独立命令，非 ros2 run）\n用于显示机器人模型、传感器数据、地图等", "use": "3D 可视化"}, {"cmd": "ros2 daemon stop && ros2 daemon start", "desc": "重启 ROS2 守护进程\n遇到奇怪问题时优先尝试", "use": "重启守护进程"}, {"cmd": "ros2 doctor", "desc": "诊断工具：检查 ROS2 环境配置是否正常", "use": "环境诊断"}, {"cmd": "ros2 wtf", "desc": "（ROS2 Humble+）更详细的诊断报告", "use": "详细诊断"}]}]}, {"title": "十三、常用终端命令", "intro": "开发中频繁使用的通用 Linux 终端命令。", "blocks": [{"t": "cmds", "items": [{"cmd": "命令格式", "desc": "说明", "use": "通用操作"}, {"cmd": "pwd", "desc": "显示当前终端所在完整路径", "use": "查看路径"}, {"cmd": "ls", "desc": "列出当前目录下的文件和文件夹", "use": "列出文件"}, {"cmd": "ls -A", "desc": "列出所有文件（含 . 开头的隐藏文件）", "use": "列出文件"}, {"cmd": "mkdir <文件夹名>", "desc": "创建文件夹", "use": "创建目录"}, {"cmd": "mkdir -p <目录1>/<目录2>/<目录3>", "desc": "递归创建多级目录，父目录不存在时自动创建", "use": "创建目录"}, {"cmd": "cd <路径>", "desc": "进入目录\ncd .. 退回上一级\ncd ~ 回到用户主目录", "use": "切换目录"}, {"cmd": "touch <文件名>", "desc": "创建空文件", "use": "创建文件"}, {"cmd": "rm <文件名>", "desc": "删除文件（不可恢复，慎重）", "use": "删除"}, {"cmd": "rm -R <文件夹名>", "desc": "递归删除文件夹（不可恢复，慎重）", "use": "删除"}, {"cmd": "mv <源> <目标>", "desc": "移动文件或文件夹，也可用于重命名", "use": "移动/重命名"}, {"cmd": "cp -r <源> <目标>", "desc": "复制文件/文件夹（-r 递归复制）", "use": "复制"}, {"cmd": "nano <文件名>", "desc": "nano 文本编辑器\nCtrl+O 保存 Ctrl+X 退出", "use": "编辑文件"}, {"cmd": "cat <文件名>", "desc": "在终端显示文件全部内容", "use": "查看文件"}, {"cmd": "echo \"内容\" > <文件名>", "desc": "将文本写入文件（覆盖原内容）", "use": "写入文件"}, {"cmd": "echo \"内容\" >> <文件名>", "desc": "将文本追加到文件末尾（不覆盖）", "use": "写入文件"}, {"cmd": "history", "desc": "显示命令历史记录", "use": "命令历史"}, {"cmd": "chmod a+x <文件名>", "desc": "添加可执行权限（ls 中文件变绿色）", "use": "修改权限"}, {"cmd": "./<可执行文件>", "desc": "执行当前目录下的可执行文件", "use": "执行程序"}, {"cmd": "python3 <脚本名>.py", "desc": "用 Python3 运行脚本", "use": "运行 Python"}, {"cmd": "g++ <源文件>.cpp -o <输出文件>", "desc": "编译 C++ 源文件", "use": "编译 C++"}, {"cmd": "code ./", "desc": "在当前目录启动 VS Code", "use": "启动 VS Code"}, {"cmd": "whereis <程序名>", "desc": "查找程序的安装路径", "use": "查找程序"}, {"cmd": "sudo apt install <软件包名>", "desc": "在线安装软件包", "use": "安装软件"}, {"cmd": "sudo dpkg -i <安装包>.deb", "desc": "安装 .deb 离线安装包", "use": "安装 deb 包"}]}]}];

const content = document.getElementById('roscontent');
const toc = document.getElementById('rostoc');
const kw = document.getElementById('roskw');
const stat = document.getElementById('rostat');

const cache = {};

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function blockHTML(b) {
  switch (b.t) {
    case 'tip':
      return '<div class="tip">💡 ' + esc(b.c) + '</div>';
    case 'warn':
      return '<div class="warn">⚠️ ' + esc(b.c) + '</div>';
    case 'text':
      return '<p>' + esc(b.c) + '</p>';
    case 'cmds':
      return b.items.map(it =>
        '<div class="cmd-row"><div class="cmd">' + esc(it.cmd) + '</div>' +
        '<span class="use">用途：' + esc(it.use) + '</span>' +
        '<div class="desc">' + esc(it.desc) + '</div></div>').join('');
    default:
      return '';
  }
}
function render() {
  let html = '';
  let tocHtml = '';
  DATA.forEach((ch, i) => {
    const id = 'rosch-' + i;
    const body = (ch.intro ? '<div class="intro">' + esc(ch.intro) + '</div>' : '') +
                 ch.blocks.map(blockHTML).join('');
    html += '<section class="chapter" id="' + id + '"><h2 class="ch-title">' + esc(ch.title) + '</h2><div class="card" id="roscard-' + i + '">' + body + '</div></section>';
    tocHtml += '<a class="ch-link" href="#' + id + '">' + esc(ch.title) + '</a>';
    cache[i] = body;
  });
  content.innerHTML = html;
  toc.innerHTML = tocHtml;
  stat.textContent = '共 ' + DATA.length + ' 章';
}
render();

let enterIdx = 0;
kw.addEventListener('input', () => {
  enterIdx = 0;
  const q = kw.value.trim().toLowerCase();
  let shown = 0;
  DATA.forEach((ch, i) => {
    const sec = document.getElementById('rosch-' + i);
    const card = document.getElementById('roscard-' + i);
    card.innerHTML = cache[i];
    const key = (ch.title + ' ' + card.textContent).toLowerCase();
    if (!q || key.includes(q)) {
      sec.style.display = '';
      shown++;
      if (q) highlight(card, q);
    } else {
      sec.style.display = 'none';
    }
  });
  stat.textContent = q ? '匹配 ' + shown + ' / ' + DATA.length + ' 章' : '共 ' + DATA.length + ' 章';
  toc.querySelectorAll('a').forEach((a, i) => {
    const sec = document.getElementById('rosch-' + i);
    a.style.display = sec.style.display !== 'none' ? '' : 'none';
  });
});
kw.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const cards = [...document.querySelectorAll('#roscontent .chapter')].filter(c => c.style.display !== 'none');
  if (!cards.length) return;
  if (enterIdx >= cards.length) enterIdx = 0;
  const target = cards[enterIdx];
  target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  cards.forEach(c => c.classList.remove('enter-hit'));
  target.querySelector('.card').classList.add('enter-hit');
  enterIdx++;
});

function highlight(root, q) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(tn => {
    const v = tn.nodeValue;
    const lower = v.toLowerCase();
    if (!lower.includes(q)) return;
    const frag = document.createDocumentFragment();
    let i = 0, idx;
    while ((idx = lower.indexOf(q, i)) !== -1) {
      frag.appendChild(document.createTextNode(v.slice(i, idx)));
      const m = document.createElement('mark');
      m.textContent = v.slice(idx, idx + q.length);
      frag.appendChild(m);
      i = idx + q.length;
    }
    frag.appendChild(document.createTextNode(v.slice(i)));
    tn.parentNode.replaceChild(frag, tn);
  });
}
})();</script>

    const id = 'linuxch-' + i;
    const body = (ch.intro ? '<div class="intro">' + esc(ch.intro) + '</div>' : '') +
                 ch.blocks.map(blockHTML).join('');
    html += '<section class="chapter" id="' + id + '"><h2 class="ch-title">' + esc(ch.title) + '</h2><div class="card" id="linuxcard-' + i + '">' + body + '</div></section>';
    tocHtml += '<a class="ch-link" href="#' + id + '">' + esc(ch.title) + '</a>';
    cache[i] = body;
  });
  content.innerHTML = html;
  toc.innerHTML = tocHtml;
  stat.textContent = '共 ' + DATA.length + ' 章';
}
render();

let enterIdx = 0;
kw.addEventListener('input', () => {
  enterIdx = 0;
  const q = kw.value.trim().toLowerCase();
  let shown = 0;
  DATA.forEach((ch, i) => {
    const sec = document.getElementById('linuxch-' + i);
    const card = document.getElementById('linuxcard-' + i);
    card.innerHTML = cache[i];
    const key = (ch.title + ' ' + card.textContent).toLowerCase();
    if (!q || key.includes(q)) {
      sec.style.display = '';
      shown++;
      if (q) highlight(card, q);
    } else {
      sec.style.display = 'none';
    }
  });
  stat.textContent = q ? '匹配 ' + shown + ' / ' + DATA.length + ' 章' : '共 ' + DATA.length + ' 章';
  toc.querySelectorAll('a').forEach((a, i) => {
    const sec = document.getElementById('linuxch-' + i);
    a.style.display = sec.style.display !== 'none' ? '' : 'none';
  });
});
kw.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const cards = [...document.querySelectorAll('#linuxcontent .chapter')].filter(c => c.style.display !== 'none');
  if (!cards.length) return;
  if (enterIdx >= cards.length) enterIdx = 0;
  const target = cards[enterIdx];
  target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  cards.forEach(c => c.classList.remove('enter-hit'));
  target.querySelector('.card').classList.add('enter-hit');
  enterIdx++;
});

function highlight(root, q) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(tn => {
    const v = tn.nodeValue;
    const lower = v.toLowerCase();
    if (!lower.includes(q)) return;
    const frag = document.createDocumentFragment();
    let i = 0, idx;
    while ((idx = lower.indexOf(q, i)) !== -1) {
      frag.appendChild(document.createTextNode(v.slice(i, idx)));
      const m = document.createElement('mark');
      m.textContent = v.slice(idx, idx + q.length);
      frag.appendChild(m);
      i = idx + q.length;
    }
    frag.appendChild(document.createTextNode(v.slice(i)));
    tn.parentNode.replaceChild(frag, tn);
  });
}
})();</script>
<script>
(function(){
  // 仅真实页签参与切换；快捷键、专注阅读等工具按钮没有 data-pane。
  var btns = document.querySelectorAll('#tabbar button[data-pane]');
  function activate(id) {
    document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('active'); });
    var pane = document.getElementById(id);
    if (pane) pane.classList.add('active');
    btns.forEach(function(b){ b.classList.toggle('on', b.dataset.pane === id); });
    try { localStorage.setItem('hubTab', id); } catch(e) {}
  }
  btns.forEach(function(b){ b.addEventListener('click', function(){ activate(b.dataset.pane); }); });
  var saved = null;
  try { saved = localStorage.getItem('hubTab'); } catch(e) {}
  if (saved && document.getElementById(saved)) activate(saved);
})();
</script>
<script>
(function(){
  var input = document.getElementById('allkw');
  var count = document.getElementById('allcount');
  var results = document.getElementById('allresults');
  var panes = [
    { id: 'pane-py', name: 'Python 入门', selector: '#content .card', title: function(el){ return el.querySelector('h3')?.textContent || 'Python 小节'; } },
    { id: 'pane-cv', name: 'OpenCV 速查', selector: '#list .card', title: function(el){ return el.querySelector('h2')?.textContent || 'OpenCV 函数'; } },
    { id: 'pane-np', name: 'NumPy 速查', selector: '#nplist .card', title: function(el){ return el.querySelector('h2')?.textContent || 'NumPy 函数'; } },
    { id: 'pane-yolo', name: 'YOLOv8 实战', selector: '#yolocontent .chapter', title: function(el){ return el.querySelector('.ch-title')?.textContent || 'YOLOv8 章节'; } },
    { id: 'pane-ros', name: 'ROS2 速查', selector: '#roscontent .chapter', title: function(el){ return el.querySelector('.ch-title')?.textContent || 'ROS2 章节'; } },
    { id: 'pane-linux', name: 'Linux 命令', selector: '#linuxcontent .chapter', title: function(el){ return el.querySelector('.ch-title')?.textContent || 'Linux 章节'; } }
  ];
  var index = [];
  panes.forEach(function(p){
    document.querySelectorAll(p.selector).forEach(function(el){
      index.push({ pane: p, el: el, title: p.title(el).replace(/\s+/g, ' ').trim(), text: el.textContent.replace(/\s+/g, ' ').trim() });
    });
  });
  function render(){
    var q = input.value.trim().toLowerCase();
    var found = q ? index.filter(function(item){ return (item.title + ' ' + item.text).toLowerCase().includes(q); }) : [];
    count.textContent = q ? '匹配 ' + found.length + ' 条' : '输入关键词开始搜索';
    if (!q) { results.innerHTML = '<div class="all-empty">支持搜索所有板块中的函数、命令、概念和说明。</div>'; return; }
    if (!found.length) { results.innerHTML = '<div class="all-empty">没有找到匹配内容。</div>'; return; }
    results.innerHTML = found.map(function(item, i){
      var preview = item.text.length > 260 ? item.text.slice(0, 260) + '…' : item.text;
      return '<div class="all-result" data-result="' + i + '"><div class="all-result-title">' + highlightText(item.title, q) + '<span class="all-result-pane">' + escapeHtml(item.pane.name) + '</span></div><div class="all-result-text">' + highlightText(preview, q) + '</div></div>';
    }).join('');
    results.querySelectorAll('.all-result').forEach(function(node, i){
      node.addEventListener('click', function(){
        var item = found[i];
        document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('active'); });
        var pane = document.getElementById(item.pane.id);
        if (pane) pane.classList.add('active');
        document.querySelectorAll('#tabbar button[data-pane]').forEach(function(b){ b.classList.toggle('on', b.dataset.pane === item.pane.id); });
        try { localStorage.setItem('hubTab', item.pane.id); } catch(e) {}
        item.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        item.el.style.boxShadow = '0 0 0 3px rgba(124,58,237,.35)';
        setTimeout(function(){ item.el.style.boxShadow = ''; }, 1600);
      });
    });
  }
  function highlightText(text, q){
    if (!q) return escapeHtml(text);
    var result = '';
    var start = 0;
    var lowerText = text.toLowerCase();
    var lowerQuery = q.toLowerCase();
    var index;
    while ((index = lowerText.indexOf(lowerQuery, start)) !== -1) {
      result += escapeHtml(text.slice(start, index));
      result += '<mark>' + escapeHtml(text.slice(index, index + q.length)) + '</mark>';
      start = index + q.length;
    }
    return result + escapeHtml(text.slice(start));
  }
  function escapeHtml(s){ return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  input.addEventListener('input', render);
  render();
})();
</script>
<script>
(() => {
  const top = document.getElementById('hubTop');
  const toast = document.getElementById('hubToast');
  const focus = document.getElementById('hubFocus');
  const shortcuts = document.getElementById('hubShortcuts');
  const paneSearch = {
    'pane-all': 'allkw', 'pane-py': 'kw', 'pane-cv': 'cvkw', 'pane-np': 'npkw',
    'pane-yolo': 'yolokw', 'pane-ros': 'roskw', 'pane-linux': 'linuxkw'
  };
  const activePane = () => document.querySelector('.pane.active');
  const showToast = message => {
    toast.textContent = message; toast.classList.add('show');
    clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 2400);
  };
  const updateTop = () => { const pane = activePane(); top.style.display = pane && pane.scrollTop > 240 ? 'block' : 'none'; };
  document.querySelectorAll('.pane').forEach(p => p.addEventListener('scroll', updateTop, {passive:true}));
  top.addEventListener('click', () => { const pane = activePane(); if (pane) pane.scrollTo({top:0, behavior:'smooth'}); });
  focus.addEventListener('click', () => {
    document.body.classList.toggle('hub-focus');
    const on = document.body.classList.contains('hub-focus');
    focus.textContent = on ? '▤ 目录' : '▣ 专注';
    showToast(on ? '已隐藏目录，进入专注阅读' : '已显示目录');
  });
  shortcuts.addEventListener('click', () => showToast('快捷键：Ctrl/⌘ + K 打开总搜索；/ 聚焦当前板块搜索；Esc 清空当前搜索。'));
  document.addEventListener('keydown', event => {
    const tag = document.activeElement && document.activeElement.tagName;
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      const button = document.querySelector('[data-pane="pane-all"]'); if (button) button.click();
      document.getElementById('allkw')?.focus(); return;
    }
    if (event.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') {
      event.preventDefault();
      const pane = activePane(); const id = pane && paneSearch[pane.id]; document.getElementById(id)?.focus(); return;
    }
    if (event.key === 'Escape' && tag === 'INPUT') {
      document.activeElement.value = ''; document.activeElement.dispatchEvent(new Event('input', {bubbles:true})); document.activeElement.blur();
    }
  });
  updateTop();
})();
</script>
